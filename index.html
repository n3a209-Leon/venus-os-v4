    async function saveSettingsAtomic(next) {
        var localSaved = false;
        try {
            var previousAcademicYear = normalizeAcademicYear(schoolYear);
            var normalizedNextYear = normalizeAcademicYear(next && next.schoolYear);
            if (!normalizedNextYear.valid) throw new Error('學年度格式錯誤');
            next = Object.assign({}, next, { schoolYear:normalizedNextYear.westernYear });
            var cid = _sl.get("hw5ren:activeClass") || activeClassId;
            if (!cid) {
                cid = "class_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
                setActiveClassId(cid);
                _sl.set("hw5ren:activeClass", cid);
            }
            var found = false;
            var updatedClasses = classes.map(function(c) {
                if (c.id !== cid) return c;
                found = true;
                return Object.assign({}, c, {
                    year:next.schoolYear, school:next.schoolName, className:next.className,
                    classSize:next.classSize, semStart1:next.semStart1, semStart2:next.semStart2,
                    semEnd1:next.semEnd1 || '', semEnd2:next.semEnd2 || ''
                });
            });
            if (!found) updatedClasses.push({
                id:cid, year:next.schoolYear, school:next.schoolName, className:next.className,
                classSize:next.classSize, semStart1:next.semStart1, semStart2:next.semStart2,
                semEnd1:next.semEnd1 || '', semEnd2:next.semEnd2 || '',
                createdAt:new Date().toLocaleDateString("zh-TW")
            });
            updatedClasses = filterTombstonedClasses(updatedClasses);

            setClassName(next.className); setSchoolName(next.schoolName); setSchoolYear(next.schoolYear);
            setSemStart1(next.semStart1); setSemStart2(next.semStart2); setClassSize(next.classSize);
            setSemEnd1(next.semEnd1 || ''); setSemEnd2(next.semEnd2 || '');
            setGroups(next.groups); setGroupVersions(next.groupVersions); setClasses(updatedClasses);
            try { window._fallbackGroups = next.groups; } catch(e) {}

            _sl.set("hw5ren:className", next.className); _sl.set("hw5ren:school", next.schoolName);
            _sl.set("hw5ren:year", next.schoolYear); _sl.set("hw5ren:semStart1", next.semStart1);
            _sl.set("hw5ren:semStart2", next.semStart2); _sl.set("hw5ren:classSize", String(next.classSize));
            _sl.set("hw5ren:semEnd1", next.semEnd1 || ''); _sl.set("hw5ren:semEnd2", next.semEnd2 || '');
            _sl.set("hw5ren:classes", JSON.stringify(updatedClasses));
            _sl.set("hw5ren:groups", JSON.stringify(next.groups));
            _sl.set("hw5ren:groups:" + cid, JSON.stringify(next.groups));
            _sl.set("hw5ren:groupVersions:" + cid, JSON.stringify(next.groupVersions));
            markSettingsDirty('settings:main', '班級設定');
            markSettingsDirty('groupVersions:' + cid, '組別版本');
            localSaved = true;

            // 學年度修正只改設定，不改資料鍵；畫面跳到新範圍內最接近今天的有資料日期。
            if (!previousAcademicYear.valid || previousAcademicYear.westernYear !== normalizedNextYear.westernYear) {
                try {
                    var allKeysForLanding = await idbKeys();
                    var landingSummary = summarizeClassDataKeys(
                        allKeysForLanding,
                        { id:cid, classKey:cid, year:normalizedNextYear.westernYear, className:next.className },
                        normalizedNextYear.westernYear,
                        false
                    );
                    var landingDate = chooseAcademicLandingDate(normalizedNextYear.westernYear, landingSummary.dates, today());
                    var landingParts = landingDate.split('-').map(Number);
                    setCurYear(landingParts[0]); setCurMonth(landingParts[1] - 1); setSelDate(landingDate);
                    try { safeSet('hw5ren:lastDate', landingDate); } catch(exLastDate) {}
                    setTimeout(function(){ doLoadMonth(landingParts[0], landingParts[1] - 1); }, 80);
                } catch(exLanding) { /* 顯示定位失敗不影響已完成的設定儲存 */ }
            }

            if (firebaseUid) {
                setDriveStatus('syncing');
                var settingsValue = buildSettingsMainValue(
                    next.className, next.schoolName, next.schoolYear, updatedClasses, next.groups,
                    next.classSize, next.semStart1, next.semStart2, schoolCalendar
                );
                var settingsOk = await saveGuardedSettingsDocument('settings:main', settingsValue, '班級設定', 'main');
                var groupsOk = await saveGuardedSettingsDocument('groupVersions:' + cid, { versions:next.groupVersions }, '組別版本', 'groups');
                if (settingsOk && settingsOk.ok && groupsOk && groupsOk.ok) {
                    _sl.remove('hw5ren:resetSchoolCal');
                    setDriveError(''); setDriveStatus('ok'); markSynced();
                } else {
                    setDriveStatus('error');
                    try { scheduleRetrySync('設定尚未完成同步'); } catch(exRetry) {}
                }
            }
            return true;
        } catch(e) {
            setDriveStatus('error');
            setDriveError(String((e && e.message) || e).slice(0, 80));
            return localSaved; // 本機已完成時，雲端會在下次連線補同步
        }
    }

    function switchClass(cls) {
        setActiveClassId(cls.id);
        _sl.set("hw5ren:activeClass", cls.id);
        setClassName(cls.className);
        setSchoolName(cls.school);
        setSchoolYear(cls.year);
        _sl.set("hw5ren:className", cls.className);

        if (cls.semStart1 !== undefined) { setSemStart1(cls.semStart1 || ''); _sl.set('hw5ren:semStart1', cls.semStart1 || ''); }
        if (cls.semStart2 !== undefined) { setSemStart2(cls.semStart2 || ''); _sl.set('hw5ren:semStart2', cls.semStart2 || ''); }
        setSemEnd1(cls.semEnd1 || ''); _sl.set('hw5ren:semEnd1', cls.semEnd1 || '');
        setSemEnd2(cls.semEnd2 || ''); _sl.set('hw5ren:semEnd2', cls.semEnd2 || '');
        try {
            var classCalRaw = _sl.get('hw5ren:schoolCal:' + cls.id) || _sl.get('hw5ren:schoolCal');
            var classCal = classCalRaw ? JSON.parse(classCalRaw) : {};
            if (classCal && typeof classCal === 'object' && !Array.isArray(classCal)) {
                setSchoolCalendar(classCal);
                _sl.set('hw5ren:schoolCal', JSON.stringify(classCal));
            }
        } catch(exCal) { setSchoolCalendar({}); }
        try {
            var classEventRaw = _sl.get('hw5ren:schoolEvents:' + cls.id) || '{}';
            var nextClassEvents = normalizeSchoolEventStore(JSON.parse(classEventRaw));
            setSchoolEventStore(nextClassEvents); setSchoolWebsiteInput(nextClassEvents.profile.schoolUrl || '');
            setSchoolEventFocusImportant(false); setExpandedSchoolEvents({});
        } catch(exEvents) { setSchoolEventStore(normalizeSchoolEventStore({})); }
        setShowClassDropdown(false);
        // 今天落在該學年度（8 月～隔年 7 月）時停在今天；否則停在該學年 8 月。
        var landing = academicLandingMonth(cls.year);
        var yr = landing.year;
        var mo = landing.month;
        setCurYear(yr);
        setCurMonth(mo);
        setSelDate(landing.date);
        setView("month");
        // 重新載入該班級的分組（傳入 cls.id 避免 activeClassId 閉包舊值問題）
        try {
            const grpKey = "hw5ren:groups:" + cls.id;
            const grpData = safeJSON(safeGet(grpKey), null);
            if (grpData && grpData.length > 0) {
                setGroups(grpData);
                try { window._fallbackGroups = grpData; } catch(exFallback) {}
                _sl.set('hw5ren:groups', JSON.stringify(grpData));
            } else {
                var emptyGroup = [{ id: 1, label: "\u7B2C1\u7D44", members: [], leader: 0, secretary: 0 }];
                setGroups(emptyGroup);
                try { window._fallbackGroups = emptyGroup; } catch(exFallback2) {}
                _sl.set('hw5ren:groups', JSON.stringify(emptyGroup));
                _sl.set(grpKey, JSON.stringify(emptyGroup));
            }
        } catch(e) {}
        // 重新載入該班級的組別版本（不存在則初始化為單一版本）
        try {
            const verKey = "hw5ren:groupVersions:" + cls.id;
            const verData = safeJSON(safeGet(verKey), null);
            if (verData && Array.isArray(verData) && verData.length > 0) {
                setGroupVersions(verData);
            } else {
                const grpKey2 = "hw5ren:groups:" + cls.id;
                const grpData2 = safeJSON(safeGet(grpKey2), null) || [{ id: 1, label: "\u7B2C1\u7D44", members: [], leader: 0, secretary: 0 }];
                var initVer = [{ verId: 1, effectiveDate: "2000-01-01", groups: grpData2 }];
                setGroupVersions(initVer);
                _sl.set(verKey, JSON.stringify(initVer));
            }
        } catch(e) {}
        // 重新載入該班級的幹部紀錄（不存在則為空）
        try {
            const offKey = "hw5ren:officers:" + cls.id;
            const offData = safeJSON(safeGet(offKey), null);
            setOfficers(offData && (offData["1"] || offData["2"]) ? offData : { "1": [], "2": [] });
        } catch(e) {
            setOfficers({ "1": [], "2": [] });
        }
        // 強制重載月曆（classPrefix 已更新，確保讀到新班級資料）
        setTimeout(function() { doLoadMonth(yr, mo); }, 50);
    }

    async function permanentlyDeleteClass(targetClass) {
        if (deleteBusyClassId || !targetClass) return;
        var target = (classes || []).find(function(item){ return item && item.id === targetClass.id; }) || targetClass;
        var aliases = classAliasesFor(target);
        if (!aliases.length) { alert('無法辨識這個班級的資料範圍，已停止刪除'); return; }
        var label = String(target.className || target.id || '未命名班級');
        var typed = window.prompt(
            '這會永久刪除「' + label + '」的所有資料：\n' +
            '作業、出勤、每日輔導、週計畫、正式輔導、分組、幹部、行事曆及所有封存。\n\n' +
            '刪除後舊封存也不會再把這個班級帶回。\n請輸入完整班名「' + label + '」確認：'
        );
        if (typed === null) return;
        if (typed.trim() !== label) { alert('班名不相符，沒有刪除任何資料'); return; }
        if (firebaseUid && !navigator.onLine) {
            alert('目前離線。為確保雲端與本機能一次完整刪除，請連上網路後再操作。');
            return;
        }
        setDeleteBusyClassId(String(target.id || aliases[0]));
        try {
            var aliasMap = {};
            aliases.forEach(function(alias){ aliasMap[alias] = true; });
            function belongsToTarget(value) {
                return !!aliasMap[String(value || '').replace(/:$/, '')];
            }
            function primaryKeyBelongs(key) {
                return aliases.some(function(alias) {
                    return key.indexOf(alias + ':day:') === 0 || key.indexOf(alias + ':counsel:') === 0;
                });
            }

            var localKeys = await idbKeys();
            var localDeleteKeys = [];
            for (var li = 0; li < localKeys.length; li++) {
                var localKey = String(localKeys[li] || '');
                var removeLocal = primaryKeyBelongs(localKey);
                if (!removeLocal) {
                    removeLocal = aliases.some(function(alias) {
                        return localKey.indexOf(secondaryPrefix('wp', alias)) === 0 ||
                            localKey.indexOf(secondaryPrefix('gr', alias)) === 0 ||
                            localKey === 'yearArchive:' + alias ||
                            localKey === 'yearArchiveIndex:' + alias;
                    });
                }
                if (!removeLocal && localKey.indexOf('conflict:') === 0) {
                    var conflictObj = parseStoredObject(await idbGet(localKey), null);
                    removeLocal = !!(conflictObj && (
                        belongsToTarget(conflictObj.classKey) ||
                        primaryKeyBelongs(String(conflictObj.originalKey || '')) ||
                        aliases.some(function(alias){ return String(conflictObj.localEnvelopeKey || '').indexOf(':' + encodeURIComponent(alias) + ':') >= 0; })
                    ));
                }
                if (removeLocal) localDeleteKeys.push(localKey);
            }

            var cloudPrimaryKeys = [], cloudPlans = [], cloudGuidance = [], cloudSettingKeys = [];
            if (firebaseUid) {
                for (var ai = 0; ai < aliases.length; ai++) {
                    var alias = aliases[ai];
                    var cloudPrimary = await window.fsGetAll(firebaseUid, alias + ':');
                    Object.keys(cloudPrimary || {}).forEach(function(key) {
                        if (primaryKeyBelongs(key)) cloudPrimaryKeys.push(key);
                    });
                    var archiveBase = 'yearArchive:' + alias;
                    var cloudArchives = await window.fsGetAll(firebaseUid, archiveBase);
                    Object.keys(cloudArchives || {}).forEach(function(key) {
                        if (key === archiveBase || key.indexOf(archiveBase + ':') === 0) cloudPrimaryKeys.push(key);
                    });
                    cloudPrimaryKeys.push('yearArchiveIndex:' + alias);
                    cloudSettingKeys.push('groupVersions:' + alias, 'officers:' + alias, 'schoolCalendar:' + alias, 'schoolEvents:' + alias);
                }
                var secondaryRoot = firebase.firestore().collection('users').doc(firebaseUid);
                for (var sqi = 0; sqi < aliases.length; sqi++) {
                    var scopedAlias = aliases[sqi];
                    var planSnapshot = await secondaryRoot.collection('weeklyPlans').where('classKey','==',scopedAlias).get();
                    planSnapshot.forEach(function(doc){
                        var data = doc.data() || {};
                        if (!data.id) data.id = doc.id;
                        cloudPlans.push(data);
                    });
                    var guidanceSnapshot = await secondaryRoot.collection('guidanceRecords').where('classKey','==',scopedAlias).get();
                    guidanceSnapshot.forEach(function(doc){
                        var data = doc.data() || {};
                        if (!data.id) data.id = doc.id;
                        cloudGuidance.push(data);
                    });
                }
                cloudPlans = cloudPlans.filter(function(item){ return item && item.id; });
                cloudGuidance = cloudGuidance.filter(function(item){ return item && item.id; });
                cloudPrimaryKeys = Array.from(new Set(cloudPrimaryKeys));
                cloudSettingKeys = Array.from(new Set(cloudSettingKeys));

                var remoteDeleteErrors = [];
                var allCloudDataKeys = cloudPrimaryKeys.concat(cloudSettingKeys);
                for (var ci = 0; ci < allCloudDataKeys.length; ci += 8) {
                    var keyBatch = allCloudDataKeys.slice(ci, ci + 8);
                    var keyResults = await Promise.all(keyBatch.map(async function(key) {
                        try { await window.fsDelete(firebaseUid, key); return null; }
                        catch(e) { return key; }
                    }));
                    remoteDeleteErrors = remoteDeleteErrors.concat(keyResults.filter(Boolean));
                }
                for (var wi = 0; wi < cloudPlans.length; wi++) {
                    try { await window.secondaryDeleteGuarded(firebaseUid, 'wp', cloudPlans[wi].id, null, true); }
                    catch(eWpDelete) { remoteDeleteErrors.push('weeklyPlans/' + cloudPlans[wi].id); }
                }
                for (var gi = 0; gi < cloudGuidance.length; gi++) {
                    try { await window.secondaryDeleteGuarded(firebaseUid, 'gr', cloudGuidance[gi].id, null, true); }
                    catch(eGrDelete) { remoteDeleteErrors.push('guidanceRecords/' + cloudGuidance[gi].id); }
                }
                if (remoteDeleteErrors.length) {
                    throw new Error('雲端仍有 ' + remoteDeleteErrors.length + ' 個項目未刪除，班級清單暫時保留，請重新操作');
                }
            }

            var previousDeletedRegistry = readClassTombstones();
            var deletedRegistry = addClassTombstone(target);
            if (firebaseUid) {
                var registryResult = await window.fsSetGuarded(
                    firebaseUid, 'settings:deletedClasses',
                    { items:deletedRegistry, updatedAt:new Date().toISOString() },
                    null, true
                );
                if (!registryResult || !registryResult.ok) {
                    writeClassTombstones(previousDeletedRegistry);
                    throw new Error('防復活登記尚未寫入雲端，請重新操作');
                }
                setSyncRevision('settings:deletedClasses', registryResult);
                clearSettingsDirty(['settings:deletedClasses']);
            } else {
                markSettingsDirty('settings:deletedClasses', '已刪除班級登記');
            }

            for (var di = 0; di < localDeleteKeys.length; di++) await idbDelete(localDeleteKeys[di]);
            var localStorageRemove = [];
            for (var si = 0; si < _sl.length(); si++) {
                var storageKey = _sl.key(si);
                if (!storageKey) continue;
                var removeStorage = aliases.some(function(alias) {
                    return storageKey.indexOf('hw5ren:' + alias + ':') === 0 ||
                        storageKey.indexOf('hw5ren:c:' + alias + ':') === 0 ||
                        storageKey === 'hw5ren:groups:' + alias ||
                        storageKey === 'hw5ren:groupVersions:' + alias ||
                        storageKey === 'hw5ren:officers:' + alias ||
                        storageKey === 'hw5ren:schoolCal:' + alias ||
                        storageKey === 'hw5ren:schoolEvents:' + alias;
                });
                if (removeStorage) localStorageRemove.push(storageKey);
            }
            localStorageRemove.forEach(function(key){ _sl.remove(key); });
            clearDirtyKeys(localDeleteKeys.concat(cloudPrimaryKeys));
            clearSettingsDirty(cloudSettingKeys);
            var syncMeta = readSyncMeta();
            Object.keys(syncMeta).forEach(function(key) {
                if (primaryKeyBelongs(key) || cloudSettingKeys.indexOf(key) >= 0) delete syncMeta[key];
            });
            try { _sl.set(SYNC_META_KEY, JSON.stringify(syncMeta)); } catch(exSyncMeta) {}

            var remainingClasses = filterTombstonedClasses((classes || []).filter(function(item){ return item && item.id !== target.id; }), deletedRegistry);
            setClasses(remainingClasses);
            _sl.set('hw5ren:classes', JSON.stringify(remainingClasses));
            setYearRecords(function(prev) {
                var next = (prev || []).filter(function(item) {
                    var ref = { id:item.id || item.classId || (String(item.year || '') + '_' + String(item.className || '')), year:item.year, className:item.className };
                    return !isClassTombstoned(ref, deletedRegistry);
                });
                _sl.set('hw5ren:years', JSON.stringify(next));
                return next;
            });

            var wasActive = aliases.some(function(alias){ return alias === (_sl.get('hw5ren:activeClass') || activeClassId); });
            var fallback = remainingClasses[0] || null;
            if (wasActive && fallback) {
                switchClass(fallback);
            } else if (wasActive) {
                setActiveClassId(''); _sl.remove('hw5ren:activeClass');
                setClassName(''); setSchoolName(''); setSchoolYear('');
                _sl.remove('hw5ren:className'); _sl.remove('hw5ren:school'); _sl.remove('hw5ren:year');
                setGroups([{ id:1, label:'第1組', members:[], leader:0, secretary:0 }]);
                setGroupVersions([]); setOfficers({ '1':[], '2':[] }); setSchoolCalendar({});
            }

            markSettingsDirty('settings:main', '班級設定');
            if (firebaseUid) {
                var currentClass = wasActive ? fallback : (remainingClasses.find(function(item){ return item.id === (_sl.get('hw5ren:activeClass') || activeClassId); }) || fallback);
                var mainValue = buildSettingsMainValue(
                    currentClass ? currentClass.className : '',
                    currentClass ? currentClass.school : '',
                    currentClass ? currentClass.year : '',
                    remainingClasses,
                    safeJSON(_sl.get('hw5ren:groups') || '[]', []),
                    parseInt(_sl.get('hw5ren:classSize') || '40', 10) || 40,
                    _sl.get('hw5ren:semStart1') || '',
                    _sl.get('hw5ren:semStart2') || '',
                    safeJSON(_sl.get('hw5ren:schoolCal') || '{}', {})
                );
                mainValue.deletedClasses = deletedRegistry;
                var mainResult = await window.fsSetGuarded(firebaseUid, 'settings:main', mainValue, null, true);
                if (mainResult && mainResult.ok) {
                    setSyncRevision('settings:main', mainResult);
                    clearSettingsDirty(['settings:main']);

                }

            setDeleteBusyClassId('');
            alert(
                '✅「' + label + '」已完整刪除\n' +
                '本機資料 ' + localDeleteKeys.length + ' 筆' +
                (firebaseUid ? '、雲端資料 ' + (cloudPrimaryKeys.length + cloudPlans.length + cloudGuidance.length) + ' 筆' : '') +
                '。\n舊封存不會再把它帶回。'
            );
        } catch(e) {
            setDeleteBusyClassId('');
            alert('刪除未完成：' + String((e && e.message) || e));
        }

    async function startSchoolYearTransition(options) {

        if (needsCloud && (!firebaseUid || !navigator.onLine)) {

            return;

        try {
            if (conflict.kind === 'primary') {

                    var primaryResult = await window.fsSetGuarded(firebaseUid, conflict.originalKey, conflict.localValue, null, true);
                    if (!primaryResult || !primaryResult.ok) throw new Error('本機版本寫入失敗');
                    await idbSet(conflict.originalKey, conflict.localValue);
                    setSyncRevision(conflict.originalKey, primaryResult);
                } else {
                    await idbSet(conflict.originalKey, conflict.remoteValue);
                    setSyncRevision(conflict.originalKey, { revision:conflict.remoteRevision, deviceId:conflict.remoteDeviceId, updatedAt:conflict.remoteUpdatedAt });
                }
                clearDirtyKeys([conflict.originalKey]);
            } else if (conflict.kind === 'settings') {
                if (choice === 'local') {
                    var settingsResult = await window.fsSetGuarded(firebaseUid, conflict.originalKey, conflict.localValue, null, true);
                    if (!settingsResult || !settingsResult.ok) throw new Error('本機設定寫入失敗');
                    setSyncRevision(conflict.originalKey, settingsResult);
                    applySettingsDocument(conflict.originalKey, conflict.localValue);
                } else {
                    applySettingsDocument(conflict.originalKey, conflict.remoteValue || {});
                    setSyncRevision(conflict.originalKey, {
                        revision:conflict.remoteRevision,
                        deviceId:conflict.remoteDeviceId,
                        updatedAt:conflict.remoteUpdatedAt
                    });
                }
                clearSettingsDirty([conflict.originalKey]);
            } else if (conflict.kind === 'wp' || conflict.kind === 'gr') {
                var envKey = conflict.localEnvelopeKey || conflict.originalKey;
                if (choice === 'remote') {
                    if (conflict.remoteValue) await putSecondaryLocal(conflict.kind, conflict.classKey, conflict.remoteValue, 'synced', false);
                    else await idbDelete(envKey);
                } else if (choice === 'local') {
                    var localResult = conflict.deleted
                        ? await window.secondaryDeleteGuarded(firebaseUid, conflict.kind, conflict.recordId, null, true)
                        : await window.secondarySaveGuarded(firebaseUid, conflict.kind, conflict.localValue, null, true);
                    if (!localResult || !localResult.ok) throw new Error('本機版本寫入失敗');
                    if (conflict.deleted) await idbDelete(envKey);
                    else await putSecondaryLocal(conflict.kind, conflict.classKey, localResult.value, 'synced', false);
                } else if (choice === 'both' && conflict.kind === 'wp') {
                    var mergedPlan = mergeWeeklyConflictRecords(conflict.localValue, conflict.remoteValue);
                    var mergeResult = await window.secondarySaveGuarded(firebaseUid, 'wp', mergedPlan, null, true);
                    if (!mergeResult || !mergeResult.ok) throw new Error('合併版本寫入失敗');
                    await putSecondaryLocal('wp', conflict.classKey, mergeResult.value, 'synced', false);
                } else if (choice === 'both' && conflict.kind === 'gr') {
                    if (conflict.remoteValue) await putSecondaryLocal('gr', conflict.classKey, conflict.remoteValue, 'synced', false);
                    var copy = Object.assign({}, conflict.localValue || {});
                    delete copy._syncRevision; delete copy._syncDeviceId; delete copy._syncUpdatedAt;
                    copy.id = String(copy.id || 'gr') + '_copy_' + Date.now();
                    copy.updatedAt = Date.now();
                    copy.conflictCopyOf = conflict.recordId || '';
                    await putSecondaryLocal('gr', conflict.classKey, copy, 'pending', false);
                    var copySync = await syncSecondaryData(firebaseUid, conflict.classKey);
                    if (copySync.failed > 0 || copySync.conflicts > 0) throw new Error('副本已留在本機，稍後請再同步');
                }

            await idbDelete(conflict._key);
            await loadSyncConflicts();
            await Promise.all([grLoad(), wpLoadPlans()]);
            setDriveError('');
            if (syncConflicts.length <= 1) setShowConflictCenter(false);

    async function uploadPrimaryKeys(keys) {
        var uploaded = [], conflicts = [], failed = [];
        var list = Array.from(new Set(keys || []));
        for (var start = 0; start < list.length; start += 8) {
            var batchKeys = list.slice(start, start + 8);
            var results = await Promise.all(batchKeys.map(async function(key) {
                try {
                    var value = await idbGet(key);
                    if (!value) return { key:key, skipped:true };
                    var expectedRevision = getSyncRevision(key);
                    if ((expectedRevision === null || expectedRevision === undefined) && readDirtyMap()[key]) expectedRevision = -1;
                    var result = await window.fsSetGuarded(firebaseUid, key, value, expectedRevision, false);
                    if (result && result.conflict) {
                        await keepConflictCopy(key, value, result, { kind:'primary', classKey:currentClassKey(), recordId:key });
                        try { window.dispatchEvent(new CustomEvent('limu-conflict-change')); } catch(exEvent) {}
                        return { key:key, conflict:true };
                    }
                    if (result && result.ok) {
                        setSyncRevision(key, result);
                        return { key:key, ok:true };
                    }
                    return { key:key, failed:true };
                } catch(e) { return { key:key, failed:true, error:e }; }
            }));
            results.forEach(function(r) {
                if (r.ok) uploaded.push(r.key);
                else if (r.conflict) conflicts.push(r.key);
                else if (r.failed) failed.push(r.key);
            });
        }
        return { uploaded:uploaded, conflicts:conflicts, failed:failed };
    }

            const keys = (await idbKeys()).filter(k => k.startsWith(_pfx+'day:') || k.startsWith(_pfx+'counsel:'));
            var primaryResult = await uploadPrimaryKeys(keys);
            var secondaryResult = await syncSecondaryData(firebaseUid, currentClassKey());
            var settingsResult = await syncDirtySettingsDocuments();
            var saveOk = primaryResult.failed.length === 0 && primaryResult.conflicts.length === 0 && secondaryResult.failed === 0 && secondaryResult.conflicts === 0 && settingsResult.failed === 0 && settingsResult.conflicts === 0;
            if (saveOk) {

                resetRetrySync();

                setDriveError('');
                setDriveStatus('ok');
                return primaryResult.uploaded.length + secondaryResult.synced + settingsResult.synced;
            }

            setDriveStatus('error');
            var totalConflicts = primaryResult.conflicts.length + secondaryResult.conflicts + settingsResult.conflicts;

            scheduleRetrySync('雲端同步未完成');
            throw new Error('雲端同步未完成');
        }
        catch (_a) {
            setDriveStatus('error');
            setDriveError(String((_a && _a.message) || _a).slice(0,80));
            if (navigator.onLine && !(_a && _a.noRetry)) scheduleRetrySync('雲端暫時無法連線');

<script>
// ── Nebula 動態星點系統 ─────────────────────────────────────
(function() {
  function initStars() {
    var app = document.querySelector('[data-theme="nebula"]');
    if (!app) return;
    // 避免重複建立
    if (document.getElementById('nebula-canvas')) return;

    var canvas = document.createElement('canvas');
    canvas.id = 'nebula-canvas';
    canvas.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7';
    document.body.insertBefore(canvas, document.body.firstChild);

    var ctx = canvas.getContext('2d');
    var stars = [];
    var W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // 建立星星
    for (var i = 0; i < 160; i++) {
      stars.push({
        x: Math.random() * 2,      // 相對位置 0-1
        y: Math.random() * 2,
        r: Math.random() * 1.4 + 0.2,
        speed: Math.random() * 0.0003 + 0.00008,
        phase: Math.random() * Math.PI * 2,
        color: ['#fff','#e8e0ff','#c8d8ff','#b0c8ff','#d4b8ff'][Math.floor(Math.random()*5)]
      });
    }

    var t = 0;
    var running = true;
    // v20.16：舊版在非星雲主題時用 setTimeout(draw,600) 無限遞迴，就算使用者
    // 一輩子不用星雲主題，整個 App 生命週期內仍每 600ms 跑一次 querySelector +
    // matchMedia。改成真正停止，由 themeObserver 在切回星雲主題時重新啟動。
    function draw() {
      if (!running) return;
      if (!document.querySelector('[data-theme="nebula"]')) {
        // 已離開星雲主題：移除畫布與監聽器，徹底停止。
        running = false;
        try { window.removeEventListener('resize', resize); } catch(e) {}
        try { canvas.remove(); } catch(e) {}
        return;
      }
      // 背景分頁或減少動態效果：暫停繪製但保留畫布，用低頻輪詢等待恢復。
      if (document.hidden || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        canvas.style.opacity = '0';
        setTimeout(draw, 600);
        return;
      }
      canvas.style.opacity = '.7';
      ctx.clearRect(0, 0, W, H);
      t += 0.008;

      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var x = ((s.x + t * s.speed * 0.3) % 1) * W;
        var y = ((s.y + t * s.speed) % 1) * H;
        var twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + s.phase));

        ctx.save();
        ctx.globalAlpha = twinkle * 0.85;
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = s.r * 3;
        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 偶爾加入流星
      if (Math.random() < 0.004) {
        var mx = Math.random() * W;
        var my = Math.random() * H * 0.5;
        var grad = ctx.createLinearGradient(mx, my, mx + 80, my + 30);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.5, 'rgba(220,200,255,0.6)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(mx + 80, my + 30);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }
    draw();
  }

  // 等 DOM ready 後初始化，並監聽主題切換
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(initStars, 500); });
  } else {
    setTimeout(initStars, 500);
  }

  // 主題切換時重新初始化
  // v20.16 修正兩件事：
  //  1. 舊版寫成「if (m.attributeName === 'data-theme') return」，等於把唯一
  //     真正該處理的事件跳過；它能運作純粹是靠 React 頻繁改 DOM 湊巧補上。
  //  2. 舊版 observe(document.body, {childList,subtree,attributes})，React 每次
  //     re-render（打字、切日期、捲動）都會產生大量 mutation records，
  //     每一筆都跑兩次 DOM 查詢，是全域性的效能稅。
  //     改用 attributeFilter 只聽 data-theme，並把批次合併成一次檢查。
  function syncNebula() {
    var nebulaApp = document.querySelector('[data-theme="nebula"]');
    if (nebulaApp && !document.getElementById('nebula-canvas')) initStars();
  }
  try {
    var observeRoot = document.getElementById('root') || document.body;
    // 注意：對同一個節點呼叫 observe() 兩次會覆蓋前一次的設定，
    // 而 subtree 無法只套用在其中一種型別上，因此拆成兩個 observer。
    // (a) 主題切換：data-theme 在子孫節點上被改寫。
    new MutationObserver(syncNebula).observe(observeRoot, {
      subtree: true,
      attributes: true,
      attributeFilter: ['data-theme']
    });
    // (b) 首次掛載：React 建立元素時 data-theme 已經設好，不會產生 attributes
    //     record，需要靠 childList 補。只聽 #root 直接子層，成本極低。
    new MutationObserver(syncNebula).observe(observeRoot, { childList: true });
  } catch(e) {}
})(); 

// 2. 🟢 獨立出來的 PWA 點擊修復區塊（修正了括號，安全閉合）
(function() {
  try {
    var isPWA = window.navigator.standalone === true ||
                window.matchMedia('(display-mode:standalone)').matches;
    if (!isPWA) return;
    // 消除 300ms 延遲和觸碰偏移
    document.addEventListener('touchstart', function(){}, {passive:true});
    // 加入全域 touch-action 和 cursor:pointer
    var style = document.createElement('style');
    style.textContent = [
      '* { touch-action: manipulation !important; -webkit-tap-highlight-color: transparent !important; }',
      'button, [onclick], a, input, select, textarea { cursor: pointer !important; }',
      // PWA 模式下確保 body 不因 status bar 偏移
      '@supports (padding-top: env(safe-area-inset-top)) {',
      '  body { padding-top: env(safe-area-inset-top) !important; }',
      '}'
    ].join('');
    document.head.appendChild(style);
    // 修正：確保 root div 的 pointer-events 正常
    var root = document.getElementById('root');
    if (root) {
      root.style.pointerEvents = 'auto';
      root.style.webkitUserSelect = 'auto';
    }
  } catch(e) {}
})();


</script>

<script>
// ── Ripple 點擊波紋效果 ──
(function() {
  document.addEventListener('click', function(e) {
    var btn = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;

    // v20.16：舊版每次點擊都重讀 btn.style.position 當作「原值」。450ms 內
    // 連點兩次時，第二次讀到的已經是自己上一次寫進去的 'relative'，還原就
    // 永久失效——殘留的 overflow:hidden 會裁掉按鈕內的下拉、提示與徽章。
    // 改成只有第一次進入時才記錄原值，並用計數器管理還原時機。
    if (btn._limuRippleDepth === undefined) btn._limuRippleDepth = 0;
    if (btn._limuRippleDepth === 0) {
      btn._limuRipplePrev = { position: btn.style.position, overflow: btn.style.overflow };
      btn.style.position = 'relative';
      btn.style.overflow = 'hidden';
    }
    btn._limuRippleDepth++;

    var wave = document.createElement('span');
    wave.className = 'ripple-wave';
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    wave.style.width = wave.style.height = size + 'px';
    wave.style.left = (e.clientX - rect.left - size / 2) + 'px';
    wave.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
    btn.appendChild(wave);

    setTimeout(function() {
      try { wave.remove(); } catch(err) {}
      btn._limuRippleDepth--;
      if (btn._limuRippleDepth <= 0) {
        btn._limuRippleDepth = 0;
        var prev = btn._limuRipplePrev || { position:'', overflow:'' };
        btn.style.position = prev.position;
        btn.style.overflow = prev.overflow;
      }
    }, 450);
  }, true);
})();
</script>

<script>
// ── Service Worker 註冊（v20.15：VENUS 圖示＋全螢幕開場）──
(function() {
  if (!('serviceWorker' in navigator)) return;
  var updateRegistration = null;
  var reloadingForUpdate = false;
  var updateActivationRequested = false;
  var SW_BUILD_ID = 'limu-teacher-v20-22-20260731';
  var SW_CACHE_NAME = 'hw-tracker-v20-22';
  var SW_URL = './sw.js?build=' + encodeURIComponent(SW_BUILD_ID);
  var lastUpdateCheck = 0;
  // v20.16：checkBuildConsistency 本來就有 15 秒節流，但 reg.update() 沒有。
  // pageshow / visibilitychange / online 每次觸發都會打一次 SW 更新請求，
  // 老師整天在 App 間切換就是持續的耗電與流量。使用者主動按「安全更新」時
  // 不走這裡，仍會立即檢查。
  var lastSwUpdate = 0;
  function throttledUpdate(reg) {
    if (!reg) return;
    var now = Date.now();
    if (now - lastSwUpdate < 15000) return;
    lastSwUpdate = now;
    try { reg.update().catch(function(){}); } catch(e) {}
  }
  // v20.11：版本標籤一律由 SW_BUILD_ID 推導，不再硬寫，避免升版時漏改成假訊息。
  var SW_LABEL = (function() {
    var m = /limu-teacher-v(\d+)-(\d+)-/.exec(SW_BUILD_ID);
    return m ? ('v' + m[1] + '.' + m[2]) : SW_BUILD_ID;
  })();

  function appVersionLabel() { return (window.__LIMU_BUILD__ && window.__LIMU_BUILD__.appVersion) || ''; }
  function currentBuildId() { return (window.__LIMU_BUILD__ && window.__LIMU_BUILD__.buildId) || ''; }
  function currentCacheName() { return (window.__LIMU_BUILD__ && window.__LIMU_BUILD__.cacheName) || ''; }

  function cacheBustReload() {
    if (reloadingForUpdate) return;
    reloadingForUpdate = true;
    try {
      var next = new URL(window.location.href);
      next.searchParams.set('limu-build', SW_BUILD_ID);
      next.searchParams.set('fresh', String(Date.now()));
      window.location.replace(next.href);
    } catch(e) {
      window.location.reload();
    }
  }

  function showUpdateBar(registration, message, mode) {
    try {
      updateRegistration = registration || updateRegistration;
      var bar = document.getElementById('limu-update-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'limu-update-bar';
        bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1e3a5f;color:#fff;padding:12px 20px max(12px,var(--safe-bottom));font-size:13px;font-weight:700;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:sans-serif';
        var updateText = document.createElement('span');
        updateText.id = 'limu-update-text';
        var updateButton = document.createElement('button');
        updateButton.id = 'limu-update-button';
        updateButton.style.cssText = 'background:#4fc3f7;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;color:#0d2137;min-width:92px';
        bar.appendChild(updateText);
        bar.appendChild(updateButton);
        document.body.appendChild(bar);
      }
      var textNode = document.getElementById('limu-update-text');
      var buttonNode = document.getElementById('limu-update-button');
      textNode.textContent = message || '📦 App ' + appVersionLabel() + ' 已下載完成';
      buttonNode.textContent = mode === 'mismatch' ? '重新檢查' : mode === 'switching' ? '切換中…' : '安全更新';
      buttonNode.disabled = mode === 'switching';
      buttonNode.setAttribute('aria-label', mode === 'mismatch' ? '重新檢查部署版本' : '啟用 App 新版本');
      buttonNode.onclick = function(){
        if (mode === 'mismatch') { cacheBustReload(); return; }
        var safety = window.LIMUUpdateSafety && window.LIMUUpdateSafety.prepare
          ? window.LIMUUpdateSafety.prepare()
          : { saved:true, count:0 };
        if (safety.count > 0 && !window.confirm('偵測到 ' + safety.count + ' 類尚未完成的輸入，草稿已自動保存。\n\n現在更新後會自動恢復草稿，確定繼續？')) return;
        updateActivationRequested = true;
        var waiting = updateRegistration && updateRegistration.waiting;
        if (waiting) {
          buttonNode.disabled = true;
          buttonNode.textContent = '更新中…';
          waiting.postMessage({ type:'SKIP_WAITING' });
        } else if (updateRegistration) {
          buttonNode.disabled = true;
          buttonNode.textContent = '檢查中…';
          updateRegistration.update().then(function() {
            if (updateRegistration.waiting) {
              updateRegistration.waiting.postMessage({ type:'SKIP_WAITING' });
            } else {
              setTimeout(cacheBustReload, 500);
            }
          }).catch(function() {
            buttonNode.disabled = false;
            buttonNode.textContent = '再試一次';
          });
        }
      };
    } catch(ex) {}
  }

  function checkBuildConsistency(reg) {
    if (!navigator.onLine) return;
    var now = Date.now();
    if (now - lastUpdateCheck < 15000) return;
    lastUpdateCheck = now;
    var checkToken = Date.now();
    Promise.all([
      fetch('./version.json?check=' + checkToken, { cache:'no-store' }).then(function(response){
        if (!response.ok) throw new Error('version unavailable');
        return response.json();
      }),
      fetch('./sw.js?check=' + checkToken, { cache:'no-store' }).then(function(response){
        if (!response.ok) throw new Error('service worker unavailable');
        return response.text();
      })
    ]).then(function(results){
      var info = results[0], swText = results[1] || '';
      var myBuild = currentBuildId(), myCache = currentCacheName();
      var completeServerBuild = !!(
        info &&
        info.buildId &&
        info.cacheName &&
        swText.indexOf(info.buildId) >= 0 &&
        swText.indexOf(info.cacheName) >= 0
      );
      if (!completeServerBuild) {
        showUpdateBar(reg, '⚠️ 網站上的部署檔案版本不一致，請重新上傳完整 ' + SW_LABEL, 'mismatch');
        return;
      }
      if (info.buildId !== myBuild || info.cacheName !== myCache) {
        showUpdateBar(reg, '📦 網站已有新版本；完成手邊輸入後可安全更新', 'update');
        try {
          reg.update().catch(function() {
            showUpdateBar(reg, '📦 已發現新版本，點此重新檢查', 'update');
          });
        } catch(e) {}
        return;
      }
      if (myBuild !== SW_BUILD_ID || myCache !== SW_CACHE_NAME) {
        showUpdateBar(reg, '⚠️ 目前頁面不是完整 App ' + appVersionLabel() + '，請重新載入', 'mismatch');
      }
    }).catch(function(){ /* 離線時不顯示混版警告 */ });

    try {
      if (!reg.active || typeof MessageChannel === 'undefined') return;
      var channel = new MessageChannel();
      // v20.16：舊版逾時只把 onmessage 設 null，從未 close()，
      // 配合下方已節流的呼叫頻率仍會持續累積 MessagePort。
      var closed = false;
      function closeChannel() {
        if (closed) return;
        closed = true;
        try { channel.port1.onmessage = null; channel.port1.close(); } catch(e) {}
      }
      var timer = setTimeout(closeChannel, 1200);
      channel.port1.onmessage = function(event){
        clearTimeout(timer);
        var info = event.data || {};
        if (info.buildId && info.buildId !== SW_BUILD_ID) {
          throttledUpdate(reg);
        }
        closeChannel();
      };
      reg.active.postMessage({ type:'GET_BUILD_INFO' }, [channel.port2]);
    } catch(e) {}
  }

  // v20.16 修正：SW 的 activate 會呼叫 clients.claim()，首次安裝時 controller
  // 必然由 null 變成新 SW，controllerchange 一定會觸發。舊版沒有區分「首次接管」
  // 與「真的換版」，導致剛裝好的新使用者第一眼就被通知「已有新版本」。
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (updateActivationRequested) { cacheBustReload(); return; }
    if (!hadController) { hadController = true; return; }
    showUpdateBar(updateRegistration, '📦 新版本已就緒；草稿會保留，請按「安全更新」', 'update');
  });

  window.addEventListener('load', function() {
    // 支援的瀏覽器會盡量將教師資料標記為持久儲存，降低系統自動清除風險。
    try {
      if (navigator.storage && navigator.storage.persisted && navigator.storage.persist) {
        navigator.storage.persisted().then(function(ok){ if (!ok) return navigator.storage.persist(); }).catch(function(){});
      }
    } catch(ePersist) {}
    navigator.serviceWorker.register(SW_URL, { updateViaCache:'none' }).then(function(reg) {
      try { window._writeLog('step', 'SW registered, scope: ' + reg.scope); } catch(e) {}

      if (reg.waiting) {
        showUpdateBar(reg, '📦 App ' + appVersionLabel() + ' 已下載完成；完成手邊輸入後再更新', 'update');
      }

      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', function() {
          if (newWorker.state === 'installed') {
            showUpdateBar(reg, '📦 App ' + appVersionLabel() + ' 已下載完成；草稿會自動保留', 'update');
          } else if (newWorker.state === 'redundant') {
            showUpdateBar(reg, '⚠️ 更新檔安裝失敗，請確認已上傳完整 ' + SW_LABEL, 'mismatch');
          }
        });
      });
      checkBuildConsistency(reg);
      throttledUpdate(reg);

      window.addEventListener('pageshow', function() {
        checkBuildConsistency(reg);
        throttledUpdate(reg);
      });
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState !== 'visible') return;
        checkBuildConsistency(reg);
        throttledUpdate(reg);
      });
    }).catch(function(err) {
      try { window._writeLog('error', 'SW register failed: ' + String(err)); } catch(e) {}
    });
  });

  // 離線/上線偵測
  function updateOnlineStatus() {
    var isOnline = navigator.onLine;
    try { window._writeLog('step', 'network: ' + (isOnline ? 'online' : 'offline')); } catch(e) {}
    if (isOnline) {
      window.dispatchEvent(new CustomEvent('hw-network-online'));
      navigator.serviceWorker.getRegistration().then(function(reg) {
        if (reg) {
          checkBuildConsistency(reg);
          throttledUpdate(reg);
        }
      }).catch(function(){});
    }
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
})();
</script>
