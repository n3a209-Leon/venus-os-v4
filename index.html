<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- status-bar-style moved below theme-color -->
<!-- v20.16：iOS 主畫面圖示下方顯示的名稱，需與 manifest 的 short_name 一致。 -->
<meta name="apple-mobile-web-app-title" content="LIMU">
<!-- v20.16：與 manifest 的 theme_color 對齊，避免 Android 狀態列與宣告值不同。 -->
<meta name="theme-color" content="#0a2731">
<meta name="description" content="LIMU 教師專用小工具：作業、出勤、輔導紀錄與學年封存">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-v20-16.png">
<title>LIMU · Venus OS</title>
<!-- v20.16：開場圖必須提前下載。舊版要等 992KB HTML 解析完、ReactDOM 載入、
     React 掛載後才由 createElement 觸發下載，網路稍慢就整段開場都是黑底。 -->
<link rel="preload" as="image" href="./assets/splash-art.jpg" fetchpriority="high">
<!-- v20.16：拿掉 ?v= 查詢字串，否則與 SW 預快取的鍵（無 query）對不上，離線取不到。 -->
<link rel="manifest" href="./manifest.webmanifest">
<style>




        /* Google Fonts loaded via <link> below for Safari compatibility */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        /* PWA standalone 模式 touch 修正 */
        html{-webkit-text-size-adjust:100%;touch-action:manipulation}
        body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        button,td,[class*="btn"],[class*="cell"],[class*="row"],[class*="nb"],[class*="gc"],[class*="hwc"]{
          touch-action:manipulation;
          -webkit-touch-callout:none;
          cursor:pointer;
        }
        /* PWA safe area (iPhone notch/home indicator)
           底部安全區由固定導覽／底部面板自行吸收，避免 body 再留一層空白。 */
        :root{--safe-bottom:env(safe-area-inset-bottom,0px)}
        body{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
        header{padding-top:max(14px,env(safe-area-inset-top))}
        body,html{background:#f0f4f8;min-height:100%;-webkit-tap-highlight-color:transparent}
        .app{min-height:100vh;min-height:100dvh;background:#f0f4f8;font-family:'Noto Sans TC',sans-serif;color:#1a2332;transition:background .3s,color .3s}

        /* ── THEME TOGGLE BUTTON ── */
        .theme-btn{margin-left:auto;padding:5px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;transition:all .15s;white-space:nowrap}
        .theme-btn:hover{background:rgba(255,255,255,.28)}

        /* ── HEADER ── */
        header{background:linear-gradient(135deg,#1e3a5f,#2d5986);padding:14px 20px 0;box-shadow:0 3px 12px rgba(0,0,0,.2);transition:background .3s;position:relative;z-index:50}
        .hi{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
        .hi-row1{display:flex;align-items:center;gap:8px}
        .hi-row2{display:flex;align-items:center}
        .ti{font-size:20px;flex-shrink:0}
        h1{color:#fff;font-size:17px;font-weight:900;letter-spacing:1px;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
        .sub{color:#a8cdf0;font-size:12px;letter-spacing:1px}
        /* 下拉選單佔整行 */
        .hi-row2 .class-switcher{width:100%}
        .hi-row2 .class-switcher-btn{width:100%;max-width:100%;justify-content:space-between;box-sizing:border-box}
        .sync-msg{margin-left:auto;font-size:12px;color:#a5d6a7;font-weight:600}
        .nav-bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:5px;padding:2px 12px 5px;flex-wrap:nowrap}

        /* ── STORAGE STATUS BAR ── */
        .stor-bar{display:flex;align-items:center;gap:10px;padding:3px 20px;font-size:11px;font-weight:600;flex-wrap:wrap;transition:background .3s}
        .stor-init  { background:rgba(255,255,255,.08); color:#90a4ae }
        .stor-checking { background:rgba(255,220,80,.15); color:#ffe082 }
        .stor-ok    { background:rgba(76,175,128,.18); color:#a5d6a7 }
        .stor-saved { background:rgba(76,175,128,.3);  color:#c8f5e0 }
        .stor-saving{ background:rgba(100,160,255,.18);color:#90caf9 }
        .stor-error { background:rgba(244,67,54,.2);   color:#ef9a9a }
        .stor-msg   { white-space:nowrap }
        .stor-detail{ opacity:.75; font-weight:400; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:400px }
        .back-btn{background:rgba(255,255,255,.15);border:none;color:#c8dff5;padding:5px 9px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;transition:background .15s;white-space:nowrap;flex-shrink:0}
        .back-btn:hover{background:rgba(255,255,255,.25)}
        .nav-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
        .nav-btn:hover{background:rgba(255,255,255,.25)}
        .month-label{color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;min-width:80px;text-align:center;flex-shrink:0}
        .date-label{color:#a8cdf0;font-size:11px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .undo-btns{display:flex;gap:3px;flex-shrink:0}
        .undo-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
        .undo-btn:hover:not(:disabled){background:rgba(255,255,255,.28)}
        .undo-btn:disabled{opacity:.3;cursor:default}

        main{max-width:960px;margin:12px auto;padding:0 14px}
        .loading{text-align:center;color:#6a8aaa;padding:30px;font-size:14px}

        /* ── 雲端同步列 ── */

        .diag-btn{background:rgba(255,255,255,.15);color:#fff}
        .diag-btn:hover{background:rgba(255,255,255,.25)}


        .backup-btn{background:rgba(76,175,128,.55);color:#fff;font-size:12px}
        .backup-btn:hover{background:rgba(76,175,128,.8)}
        .day-backup-btn{display:block;width:calc(100% - 0px);margin:16px 0 0;padding:14px;background:#4caf80;color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;box-shadow:0 4px 12px rgba(76,175,128,.3);transition:opacity .15s}
        .day-backup-btn:hover{opacity:.88}
        [data-theme="nerv"] .day-backup-btn{background:transparent;border:1px solid #ffcc00;color:#ffcc00;border-radius:4px;font-family:'Share Tech Mono',monospace;letter-spacing:2px;box-shadow:0 0 10px rgba(255,204,0,.2)}
        .import-btn2{background:rgba(255,152,0,.55);color:#fff;font-size:12px}
        .import-btn2:hover{background:rgba(255,152,0,.8)}

        /* ── NEBULA 星雲主題 ── */

        /* ══════════════════════════════════════════
           NEBULA THEME — Deep Space Edition
           藍紫星雲 + 動態粒子 + 毛玻璃卡片
        ══════════════════════════════════════════ */

        /* 動態星空粒子 keyframes */
        @keyframes purple-glow-pulse{
          0%,100%{box-shadow:0 0 6px rgba(160,80,255,.6),0 0 14px rgba(120,60,220,.3),inset 0 0 6px rgba(140,70,240,.15)}
          50%{box-shadow:0 0 14px rgba(180,100,255,.9),0 0 30px rgba(140,70,240,.5),inset 0 0 10px rgba(160,90,255,.25)}
        }
        @keyframes green-glow-pulse{
          0%,100%{box-shadow:0 0 6px rgba(76,210,120,.6),0 0 14px rgba(76,210,120,.3),inset 0 0 6px rgba(76,210,120,.15)}
          50%{box-shadow:0 0 12px rgba(76,210,120,.9),0 0 28px rgba(76,210,120,.5),inset 0 0 10px rgba(76,210,120,.25)}
        }
        @keyframes orange-glow-pulse{
          0%,100%{box-shadow:0 0 6px rgba(255,143,0,.6),0 0 14px rgba(255,143,0,.3),inset 0 0 6px rgba(255,143,0,.15)}
          50%{box-shadow:0 0 12px rgba(255,143,0,.9),0 0 28px rgba(255,143,0,.5),inset 0 0 10px rgba(255,143,0,.25)}
        }
        @keyframes nebula-drift{0%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-8px,12px) scale(1.08);opacity:1}100%{transform:translate(0,0) scale(1);opacity:.7}}
        @keyframes nebula-drift2{0%{transform:translate(0,0) rotate(0deg);opacity:.5}50%{transform:translate(10px,-8px) rotate(180deg);opacity:.9}100%{transform:translate(0,0) rotate(360deg);opacity:.5}}
        @keyframes star-twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
        @keyframes nebula-glow{0%,100%{box-shadow:0 0 20px rgba(120,80,255,.3),0 0 40px rgba(60,120,255,.15)}50%{box-shadow:0 0 35px rgba(150,100,255,.5),0 0 70px rgba(80,140,255,.25)}}
        @keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        @keyframes float-star{0%{transform:translateY(0px)}50%{transform:translateY(-6px)}100%{transform:translateY(0px)}}

        /* 根容器：深空背景 */
        [data-theme="nebula"]{
          background:#04050f;
          color:#d0e8ff;
          position:relative;
          min-height:100vh;
        }

        /* 星空背景層 */
        [data-theme="nebula"]::before{
          content:'';
          position:fixed;
          inset:0;
          z-index:0;
          background:
            radial-gradient(ellipse 80% 60% at 20% 30%, rgba(80,40,180,.28) 0%, transparent 65%),
            radial-gradient(ellipse 60% 80% at 80% 70%, rgba(20,80,200,.22) 0%, transparent 60%),
            radial-gradient(ellipse 40% 50% at 50% 10%, rgba(160,60,220,.18) 0%, transparent 55%),
            radial-gradient(ellipse 90% 40% at 10% 90%, rgba(30,100,180,.20) 0%, transparent 60%),
            radial-gradient(ellipse 50% 70% at 90% 20%, rgba(100,40,200,.18) 0%, transparent 55%),
            linear-gradient(135deg, #04050f 0%, #070a1a 40%, #060818 70%, #050410 100%);
          pointer-events:none;
        }

        /* 星點層 — 靜態若影若現 */
        [data-theme="nebula"]::after{
          content:'· ✦ · ✧ · ⋆ · ✦ · ✧ · ⋆ · ✦ · ✧ · ⋆ · ✦ · ✧ ·';
          position:fixed;
          inset:0;
          z-index:0;
          font-size:9px;
          line-height:4;
          letter-spacing:18px;
          color:rgba(210,195,255,.22);
          word-break:break-all;
          overflow:hidden;
          pointer-events:none;
        }

        /* 所有內容在星空之上 */
        [data-theme="nebula"] .app > *{position:relative;z-index:1}
        /* 星空層管理：::before z-index:-1，內容層 z-index:0（預設）
           不用 isolation，讓星空可以透過卡片間隙顯現 */
        [data-theme="nebula"] .app{background:transparent}
        [data-theme="nebula"] main{background:transparent !important;position:relative;z-index:1}
        [data-theme="nebula"] main > *{position:relative;z-index:1}
        [data-theme="nebula"] .calendar{position:relative;z-index:1}
        [data-theme="nebula"] .month-summary{position:relative;z-index:1}
        [data-theme="nebula"] header{
          position:relative;z-index:2;
          background:rgba(6,3,20,.88);
          border-bottom:1px solid rgba(120,80,255,.4);
          backdrop-filter:blur(16px);
          -webkit-backdrop-filter:blur(16px);
          animation:nebula-glow 4s ease-in-out infinite;
        }
        [data-theme="nebula"] h1{
          color:#d4b8ff;
          text-shadow:0 0 12px rgba(180,140,255,.6),0 0 25px rgba(120,80,255,.3);
        }

        /* 卡片：半透明毛玻璃（讓星空透出） */
        [data-theme="nebula"] .stor-bar,
        [data-theme="nebula"] .calendar,
        [data-theme="nebula"] .sum-wrap,
        [data-theme="nebula"] .day-view-card,

          background:rgba(8,5,24,.55) !important;
          border:1px solid rgba(120,80,255,.3) !important;

          backdrop-filter:blur(14px);
          -webkit-backdrop-filter:blur(14px);
          box-shadow:0 4px 24px rgba(80,40,180,.15), inset 0 1px 0 rgba(150,100,255,.12);
          position:relative;
          z-index:1;

        [data-theme="nebula"] .month-summary{background:rgba(6,4,22,.55) !important;border-radius:16px;border:1px solid rgba(100,70,220,.2) !important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

        [data-theme="nebula"] .theme-btn{

        /* 名字按鈕（六角形） */
        [data-theme="nebula"] .nb{
          background:rgba(60,40,120,.4);

        [data-theme="nebula"] .nb.done{
          background:rgba(30,160,80,.2);

          content:""; position:absolute; inset:0; z-index:4; pointer-events:none;
          background:
            linear-gradient(180deg,rgba(2,5,9,.22) 0%,transparent 25%,transparent 58%,rgba(2,6,10,.28) 72%,rgba(2,5,8,.82) 100%),

            radial-gradient(ellipse at 50% 28%,rgba(255,224,176,.32),transparent 13%),
            repeating-linear-gradient(88deg,transparent 0 9%,rgba(255,218,166,.09) 10%,transparent 12% 22%);
          filter:blur(4px);
          mix-blend-mode:screen;
          animation:spl-sea-shimmer 2.6s ease-in-out infinite alternate;
        }

        .spl-dust {
          position:absolute; inset:0; z-index:3; pointer-events:none;
        }
        .spl-particle {
          position:absolute;
          width:2px; height:2px;
          border-radius:50%;
          background:#f3dcb8;
          box-shadow:0 0 7px rgba(255,225,178,.55);
          animation:spl-dust-float var(--dur,8s) ease-in-out var(--delay,0s) infinite;
        }

        .spl-titles {
          position:absolute;
          bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 62px));
          left:18px; right:18px;
          z-index:6; text-align:center;
          animation:spl-title-in .7s cubic-bezier(.18,.72,.22,1) .9s both;
        }
        .spl-titles.spl-quick {
          animation-duration:.38s;
          animation-delay:.25s;
        }
        .spl-title-main {
          font-family:'Cinzel Decorative','Noto Sans TC',serif;
          font-size:clamp(19px,5.3vw,27px);
          font-weight:700;
          letter-spacing:4px;
          color:#fff8eb;
          text-shadow:0 2px 18px rgba(0,0,0,.92),0 0 26px rgba(238,194,143,.38);
        }
        .spl-title-sub {
          font-family:'Noto Sans TC',sans-serif;
          font-size:10px; font-weight:600; letter-spacing:3.5px;
          color:rgba(239,215,184,.78); margin-top:7px;
          text-shadow:0 1px 8px rgba(0,0,0,.95);
        }
        .spl-status {
          position:absolute;
          bottom:max(46px,calc(env(safe-area-inset-bottom,0px) + 27px));
          left:0; right:0;
          z-index:6; text-align:center;
          font-size:10px; letter-spacing:2px;
          color:rgba(242,218,187,.62);
          font-family:'Noto Sans TC',sans-serif;
          animation:spl-status-blink 1.6s ease-in-out infinite;
          min-height:14px;
        }
        .spl-skip {
          position:absolute;
          right:max(14px,env(safe-area-inset-right,0px));
          top:max(15px,env(safe-area-inset-top,0px));
          z-index:7;
          padding:7px 10px;
          border:1px solid rgba(255,236,207,.24);
          border-radius:999px;
          background:rgba(5,8,12,.24);
          color:rgba(255,242,220,.7);
          font-size:10px;
          letter-spacing:1px;
          backdrop-filter:blur(7px);
          -webkit-backdrop-filter:blur(7px);
        }
        @media (min-aspect-ratio:3/4) {
          .spl-img-wrap img { object-position:center 35%; }
          .spl-titles { bottom:max(62px,calc(env(safe-area-inset-bottom,0px) + 44px)); }
        }
        @media (prefers-reduced-motion:reduce) {
          /* v20.16：補上 .spl-exit 與 .spl-img-exit，舊版漏掉這兩個退場動畫，
             開了「減少動態效果」的使用者仍會看到 0.34s / 0.55s 的縮放淡出。 */
          .spl-img-wrap,.spl-img-wrap img,.spl-halo,.spl-sea-glow,.spl-particle,.spl-titles,.spl-status,
          .spl-overlay.spl-exit,.spl-img-wrap.spl-img-exit {
            animation-duration:.01ms !important;
            animation-iteration-count:1 !important;
          }
        }

        /* ══ GALAXY TRANSITION ══════════════════════════════════════ */
        /* ── Galaxy 過場：全螢幕浮現，無邊框無輪廓 ── */
        .galaxy-transition {
          position:fixed; inset:0; z-index:8000;
          pointer-events:none;
          display:flex; align-items:center; justify-content:center;
          background:transparent;
        }
        /* 容器：全螢幕，圖片在正中央，mask 做成超大柔和橢圓 */
        .galaxy-transition-wrap {
          position:absolute; inset:0;
          display:flex; align-items:center; justify-content:center;
          opacity:0;
          /* 動畫由 .fwd / .bwd class 控制 */
        }
        .galaxy-transition-img {
          /* 圓框圖正方形顯示，screen blend 黑底自然去背 */
          width:min(72vw, 340px);
          height:min(72vw, 340px);
          max-width:90vw;
          display:block;
          object-fit:contain;
          mix-blend-mode: screen;
          /* 柔和圓形遮罩，讓圓框自然融入 */
          -webkit-mask-image: radial-gradient(circle,
            black  0%,
            black  42%,
            rgba(0,0,0,.9)  55%,
            rgba(0,0,0,.6)  68%,
            rgba(0,0,0,.2)  82%,
            transparent     95%
          );
          mask-image: radial-gradient(circle,
            black  0%,
            black  42%,
            rgba(0,0,0,.9)  55%,
            rgba(0,0,0,.6)  68%,
            rgba(0,0,0,.2)  82%,
            transparent     95%
          );
          filter: brightness(1.15) saturate(1.2) contrast(1.05);
        }
        /* 前進：從右淡入→停留→往左淡出 */
        @keyframes galaxy-burst-fwd {
          0%   { opacity:0;    transform:scale(0.08) translateX(60px);  filter:blur(18px); }
          28%  { opacity:.92;  transform:scale(0.92) translateX(12px);  filter:blur(1px);  }
          55%  { opacity:1;    transform:scale(1.0)  translateX(0px);   filter:blur(0px);  }
          78%  { opacity:.88;  transform:scale(1.02) translateX(-10px); filter:blur(0px);  }
          100% { opacity:0;    transform:scale(1.15) translateX(-50px); filter:blur(10px); }
        }
        /* 後退：從左淡入→停留→往右淡出（鏡像） */
        @keyframes galaxy-burst-bwd {
          0%   { opacity:0;    transform:scale(0.08) translateX(-60px); filter:blur(18px); }
          28%  { opacity:.92;  transform:scale(0.92) translateX(-12px); filter:blur(1px);  }
          55%  { opacity:1;    transform:scale(1.0)  translateX(0px);   filter:blur(0px);  }
          78%  { opacity:.88;  transform:scale(1.02) translateX(10px);  filter:blur(0px);  }
          100% { opacity:0;    transform:scale(1.15) translateX(50px);  filter:blur(10px); }
        }
        .galaxy-transition-wrap.fwd {
          animation: galaxy-burst-fwd 0.56s cubic-bezier(.16,1,.3,1) forwards;
        }
        .galaxy-transition-wrap.bwd {
          animation: galaxy-burst-bwd 0.56s cubic-bezier(.16,1,.3,1) forwards;
        }

        /* ══ WEEKLY PLAN MODAL ══════════════════════════════════════ */
        .wp-overlay {

            filter: brightness(0.4);
            pointer-events: none;
        }
        .wp-box {
            background: #1a1a2e; border-radius: 18px;

            color: #b39ddb; padding: 0 6px 0 0; line-height: 1;

        .wp-list-empty { padding: 32px 16px; text-align: center; color: rgba(255,255,255,.35); font-size: 14px; }
        .wp-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 16px; cursor: pointer;

            transition: background .15s;
        }
        .wp-list-item:hover { background: rgba(255,255,255,.05); }
        .wp-list-item.has-plan .wp-list-week { color: #ce93d8; }
        .wp-list-week { font-size: 15px; font-weight: 600; color: #e0e0e0; }
        .wp-list-sub { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 2px; }
        .wp-list-badge { font-size: 12px; color: #9c64d0; }
        .wp-new-btn {
            margin: 14px 16px; padding: 12px;
            background: linear-gradient(135deg,#5e35b1,#7b1fa2);
            color: #fff; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer; width: calc(100% - 32px);
        }
        /* DETAIL VIEW */
        .wp-detail-row {
            display: flex; gap: 0;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .wp-detail-day {
            flex-shrink: 0; width: 56px; padding: 10px 8px;
            text-align: center; font-size: 12px; color: rgba(255,255,255,.45);
            background: rgba(255,255,255,.03);
            display: flex; flex-direction: column; justify-content: flex-start; gap: 2px;
        }

        .wp-detail-day.today .date { color: #ce93d8; }
        .wp-detail-items { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
        .wp-detail-empty { font-size: 12px; color: rgba(255,255,255,.2); }
        .wp-detail-hw { display: flex; align-items: baseline; gap: 5px; font-size: 13px; }
        .wp-detail-num { color: rgba(255,255,255,.35); font-size: 11px; flex-shrink: 0; }
        .wp-detail-name { color: #e0e0e0; }
        .wp-detail-note { color: rgba(255,255,255,.4); font-size: 11px; }
        .wp-detail-note.wp-detail-type-note { color: #ffcc80; }
        .wp-detail-edit-btn {
            margin: 14px 16px; padding: 10px;
            background: rgba(103,58,183,.35); border: 1px solid rgba(103,58,183,.5);

            font-size: 13px; font-weight: 600; cursor: pointer; width: calc(100% - 32px);

        .wp-table { width: 100%; border-collapse: collapse; flex-shrink: 0; }
        .wp-th {
            padding: 6px 2px; text-align: center; font-size: 11px; font-weight: 600;

        .wp-item { display: flex; align-items: flex-start; gap: 2px; margin-bottom: 3px; }

            font-size: 14px; font-weight: 600; cursor: pointer;
        }

            background: linear-gradient(135deg,#5e35b1,#7b1fa2); color: #fff;

        .wp-footer-btn.cancel { background: rgba(255,255,255,.07); color: rgba(255,255,255,.6); }
        /* INPUT POPUP */
        .wp-input-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0,0,0,.7);
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 0;
        }
        /* v20.21：整組 wp-input-* 原本是為深色底寫死的（box #1e1b3a、field 白字），
           被淺色主題覆寫外框後就變成白框裡嵌黑格。改為統一走 v20.20 的卡片色票。 */
        .wp-input-box {
            background: var(--card-bg, #1e1b3a); color: var(--card-fg, #fff);
            border-radius: 18px 18px 0 0;
            width: 100%; max-width: 480px;
            padding: 20px 16px calc(14px + var(--safe-bottom));
            box-shadow: 0 -4px 30px rgba(0,0,0,.5);
            display: flex; flex-direction: column; gap: 10px;
        }

        .wp-type-row { display: flex; gap: 8px; }
        .wp-type-btn {
            flex: 1; padding: 9px; border-radius: 10px;
            border: 1px solid var(--card-line, rgba(255,255,255,.12));
            background: var(--card-chip, rgba(255,255,255,.05));

        .wp-type-btn.sel.note { background: rgba(230,126,34,.3); border-color: #e67e22; color: #ffcc80; }
        .wp-preset-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .wp-preset-tag {
            padding: 5px 10px; border-radius: 20px;
            background: var(--card-chip, rgba(103,58,183,.3));
            border: 1px solid var(--card-line, rgba(103,58,183,.4));
            color: inherit; font-size: 12px; cursor: pointer;
            transition: filter .1s; -webkit-tap-highlight-color: rgba(255,220,0,.5);
        }
        .wp-preset-tag:active { filter: brightness(1.8) drop-shadow(0 0 6px #ffd700); }
        .wp-input-field {
            width: 100%; padding: 10px 12px; border-radius: 10px; box-sizing: border-box;
            background: var(--card-chip, rgba(255,255,255,.08));
            border: 1px solid var(--card-line, rgba(255,255,255,.12));

        .wp-input-btns { display: flex; gap: 8px; margin-top: 2px; }
        .wp-input-btn {
            flex: 1; padding: 11px; border-radius: 10px; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: filter .1s; -webkit-tap-highlight-color: rgba(255,220,0,.5);
        }
        .wp-input-btn:active { filter: brightness(1.8) drop-shadow(0 0 6px #ffd700); }
        .wp-input-btn.confirm { background: linear-gradient(135deg,#5e35b1,#7b1fa2); color: #fff; }
        .wp-input-btn.cancel { background: rgba(255,255,255,.07); color: rgba(255,255,255,.5); }
        /* scrollable body */
        .wp-box > :not(.wp-header):not(.wp-footer):not(.wp-week-nav) {
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

  // Firestore 存取函數（全域）
  function requireFirestore(uid) {
    if (!uid) throw new Error('尚未登入 Firebase');
    if (typeof firebase === 'undefined' || !firebase.firestore) throw new Error('Firebase 尚未載入');
    return firebase.firestore();
  }

  // 每台裝置保留穩定識別碼，只用於同步衝突判斷，不含個資。
  window.getAppDeviceId = function() {
    var key = 'hw5ren:deviceIdV1';
    try {
      var current = localStorage.getItem(key);
      if (current) return current;
      var random = '';
      try {
        var bytes = new Uint8Array(12);
        crypto.getRandomValues(bytes);
        random = Array.prototype.map.call(bytes, function(b){ return b.toString(16).padStart(2, '0'); }).join('');
      } catch(ex) {
        random = String(Date.now()) + Math.random().toString(16).slice(2);
      }
      current = 'dev_' + random;
      localStorage.setItem(key, current);
      return current;
    } catch(e) { return 'dev_session'; }
  };

  window.fsGet = async function(uid, key) {
    try {
      var db = requireFirestore(uid);
      var doc = await db.collection('users').doc(uid).collection('data').doc(key).get();
      return doc.exists ? doc.data().value : null;
    } catch(e) {
      try { window._writeLog && window._writeLog('error', 'fsGet '+key+': '+String(e && e.message || e)); } catch(ex) {}
      throw e;
    }
  };

  // 讀取設定資料時一併取得 revision，讓本機能以交易式寫入避免跨裝置覆蓋。
  window.fsGetWithMeta = async function(uid, key) {
    try {
      var db = requireFirestore(uid);
      var doc = await db.collection('users').doc(uid).collection('data').doc(key).get();
      if (!doc.exists) return null;
      var data = doc.data() || {};
      return {
        value: data.value,
        updatedAt: data.updatedAt || '',
        revision: Number(data.revision || 0),
        deviceId: data.deviceId || ''
      };
    } catch(e) {
      try { window._writeLog && window._writeLog('error', 'fsGetWithMeta '+key+': '+String(e && e.message || e)); } catch(ex) {}
      throw e;
    }
  };

  window.fsSet = async function(uid, key, value) {
    try {
      var db = requireFirestore(uid);
      await db.collection('users').doc(uid).collection('data').doc(key).set({
        value: value,
        updatedAt: new Date().toISOString(),
        deviceId: window.getAppDeviceId(),
        revision: firebase.firestore.FieldValue.increment(1)
      }, { merge: true });
      return true;
    } catch(e) {
      try { window._writeLog && window._writeLog('error', 'fsSet '+key+': '+String(e && e.message || e)); } catch(ex) {}
      throw e;
    }
  };

  // 對每日資料採交易式寫入。若雲端版本已由其他裝置變更，保留雙方資料並回報衝突。
  window.fsSetGuarded = async function(uid, key, value, expectedRevision, force) {
    try {
      var db = requireFirestore(uid);
      var ref = db.collection('users').doc(uid).collection('data').doc(key);
      var deviceId = window.getAppDeviceId();
      return await db.runTransaction(async function(tx) {
        var snap = await tx.get(ref);
        var old = snap.exists ? (snap.data() || {}) : {};
        var remoteRevision = Number(old.revision || 0);
        var hasExpected = expectedRevision !== null && expectedRevision !== undefined && expectedRevision !== '';
        if (!force && snap.exists && hasExpected && remoteRevision !== Number(expectedRevision) && old.deviceId && old.deviceId !== deviceId) {
          return {
            ok: false,
            conflict: true,
            remoteRevision: remoteRevision,
            remoteDeviceId: old.deviceId || '',
            remoteUpdatedAt: old.updatedAt || '',
            remoteValue: old.value
          };
        }
        var nextRevision = remoteRevision + 1;
        var updatedAt = new Date().toISOString();
        tx.set(ref, {
          value: value,
          updatedAt: updatedAt,
          deviceId: deviceId,
          revision: nextRevision
        }, { merge: true });
        return { ok: true, conflict: false, revision: nextRevision, updatedAt: updatedAt, deviceId: deviceId };
      });
    } catch(e) {
      try { window._writeLog && window._writeLog('error', 'fsSetGuarded '+key+': '+String(e && e.message || e)); } catch(ex) {}
      throw e;
    }
  };

  window.fsDelete = async function(uid, key) {
    try {
      var db = requireFirestore(uid);
      await db.collection('users').doc(uid).collection('data').doc(key).delete();
      return true;
    } catch(e) {
      try { window._writeLog && window._writeLog('error', 'fsDelete '+key+': '+String(e && e.message || e)); } catch(ex) {}
      throw e;
    }
  };

  window.fsGetAll = async function(uid, prefix) {
    try {
      var db = requireFirestore(uid);
      var col = db.collection('users').doc(uid).collection('data');
      var query = prefix
        ? col.orderBy(firebase.firestore.FieldPath.documentId()).startAt(prefix).endAt(prefix + '\uf8ff')
        : col;
      var snap = await query.get();
      var result = {};
      snap.forEach(function(doc) {
        if (!prefix || doc.id.startsWith(prefix)) {
          result[doc.id] = doc.data().value;
        }
      });
      return result;
    } catch(e) {
      try { window._writeLog && window._writeLog('error', 'fsGetAll '+prefix+': '+String(e && e.message || e)); } catch(ex) {}

  };

  window.fsGetAllWithMeta = async function(uid, prefix) {

      var db = requireFirestore(uid);

      var query = prefix
        ? col.orderBy(firebase.firestore.FieldPath.documentId()).startAt(prefix).endAt(prefix + '\uf8ff')
        : col;
      var snap = await query.get();
      var result = {};
      snap.forEach(function(doc) {
        if (!prefix || doc.id.startsWith(prefix)) {
          var d = doc.data() || {};
          result[doc.id] = {
            value: d.value,
            updatedAt: d.updatedAt || '',
            revision: Number(d.revision || 0),
            deviceId: d.deviceId || ''
          };
        }
      });

      try { window._writeLog && window._writeLog('error', 'fsGetAllWithMeta '+prefix+': '+String(e && e.message || e)); } catch(ex) {}
      throw e;
    }
  };

  function secondaryCollectionName(kind) {
    if (kind === 'wp') return 'weeklyPlans';
    if (kind === 'gr') return 'guidanceRecords';
    throw new Error('未知的同步資料類型');
  }

  // 週計畫與正式輔導採與每日資料相同的交易式版本保護。
  window.secondarySaveGuarded = async function(uid, kind, record, expectedRevision, force) {
    try {
      var db = requireFirestore(uid);
      if (!record || !record.id) throw new Error('同步資料缺少 id');
      var ref = db.collection('users').doc(uid).collection(secondaryCollectionName(kind)).doc(record.id);
      var deviceId = window.getAppDeviceId();
      return await db.runTransaction(async function(tx) {
        var snap = await tx.get(ref);
        var old = snap.exists ? (snap.data() || {}) : {};
        var remoteRevision = Number(old._syncRevision || 0);
        var remoteDeviceId = old._syncDeviceId || '';
        var hasExpected = expectedRevision !== null && expectedRevision !== undefined && expectedRevision !== '';
        if (!force && snap.exists && hasExpected && remoteRevision !== Number(expectedRevision) && remoteDeviceId && remoteDeviceId !== deviceId) {
          return { ok:false, conflict:true, remoteRevision:remoteRevision, remoteDeviceId:remoteDeviceId, remoteUpdatedAt:old._syncUpdatedAt || '', remoteValue:old };
        }
        var nextRevision = remoteRevision + 1;
        var updatedAt = new Date().toISOString();

          _syncRevision:nextRevision,
          _syncDeviceId:deviceId,
          _syncUpdatedAt:updatedAt

        var remoteRevision = Number(old._syncRevision || 0);

        var hasExpected = expectedRevision !== null && expectedRevision !== undefined && expectedRevision !== '';

          return { ok:false, conflict:true, remoteRevision:remoteRevision, remoteDeviceId:remoteDeviceId, remoteUpdatedAt:old._syncUpdatedAt || '', remoteValue:old };

        tx.delete(ref);
        return { ok:true, conflict:false, deleted:true, revision:remoteRevision };
      });

      try { window._writeLog && window._writeLog('error', 'secondaryDeleteGuarded '+kind+': '+String(e && e.message || e)); } catch(ex) {}

  };
  window.wpGetAll = async function(uid, classKey, fromDate, toDate) {

      // v20.19：維持回傳 [] 以免更動呼叫端契約，但至少留下紀錄。

<script>
window._writeLog = function(type, msg) {
  try {
  } catch(e) {}
};

window.onerror = function(msg, src, line, col, err) {
  try { window._writeLog('fatal', String(msg) + ' @' + line + ':' + col); } catch(e) {}
};

window.onunhandledrejection = function(e) {
  try { window._writeLog('promise', String(e && e.reason ? e.reason : e)); } catch(ex) {}
};

function showError(msg, color) {
  // 記錄到 log
  window._writeLog('error', msg);
  try {
    var ov = document.getElementById('error-overlay');
    if (!ov) return;
    ov.style.background = color || '#1a0000';
    ov.style.color = color === '#001a1a' ? '#88ffee' : '#ff8888';
    ov.textContent = msg;
    ov.style.display = 'block';
    // 加「關閉」按鈕
    var btn = document.createElement('button');
    btn.textContent = '✕ 關閉';
    btn.style.cssText = 'display:block;margin-top:16px;padding:8px 20px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;font-size:14px;cursor:pointer;font-family:sans-serif';
    btn.onclick = function() { ov.style.display = 'none'; };
    ov.appendChild(btn);
  } catch(e) {}
}

// ── 錯誤日誌（全域，所有 script 共享）──
window._errLog = [];
window._stepLog = [];
// v20.16：_errLog 舊版沒有上限，且每寫一筆就把整個陣列重新 JSON.stringify 到
// localStorage（成本 O(n²)）。只要有一個會重複發生的錯誤（同步重試、render 迴圈、
// 離線佇列失敗），記憶體與 CPU 就會持續攀升，長時間開著的 PWA 會愈跑愈鈍。
// 這裡比照 _stepLog 加上限，並把寫入改成 debounce。
var _LOG_MAX = 50;
var _logFlushTimer = null;
function _flushDebugLog() {
  _logFlushTimer = null;
  try {
    var log = { ts: new Date().toLocaleString('zh-TW'), steps: window._stepLog.slice(-20), errors: window._errLog };
    localStorage.setItem('hw5ren:debugLog', JSON.stringify(log));
  } catch(ex) {}
}
window._writeLog = function(type, msg) {
  try {
    var entry = { t: new Date().toLocaleTimeString('zh-TW'), type: type, msg: String(msg).slice(0,200) };
    if (type === 'step') {
      window._stepLog.push(entry);
      if (window._stepLog.length > 30) window._stepLog.shift();
    } else {
      window._errLog.push(entry);
      if (window._errLog.length > _LOG_MAX) window._errLog.splice(0, window._errLog.length - _LOG_MAX);
    }
    if (_logFlushTimer === null) _logFlushTimer = setTimeout(_flushDebugLog, 400);
  } catch(e) {}
};

function debugStep(step) {
  try { if (window.location.search.indexOf('debug=1') > -1) console.error('[STEP]', step); } catch(e) {}
  try {
    var el = document.getElementById('safari-debug');
    if (el) {
      var isError = step.indexOf('FAIL')>-1 || step.indexOf('ERROR')>-1 || step.indexOf('NOT FOUND')>-1;
      el.innerText = step;
      el.style.background = isError ? '#8B0000' : '#006400';
      el.style.display = isError ? 'block' : 'none'; // 只有錯誤才顯示
    }
  } catch(e) {}
}
debugStep('JS START');

// PWA standalone 模式偵測
var _isPWA = false;

// 記錄頁面 visibility change（iOS PWA 切背景時的觸發點）
document.addEventListener('visibilitychange', function() {
  try {
    window._writeLog('step', 'visibility:' + document.visibilityState);
    document.documentElement.classList.toggle('performance-paused', document.hidden);
  } catch(e) {}
});
window.addEventListener('pagehide', function() {
  try { window._writeLog('step', 'pagehide'); } catch(e) {}
});
window.addEventListener('pageshow', function(e) {
  try { window._writeLog('step', 'pageshow persisted:' + e.persisted); } catch(e) {}
});
try {
  _isPWA = window.navigator.standalone === true ||
           window.matchMedia('(display-mode: standalone)').matches;
} catch(e) {}
if (_isPWA) {
  debugStep('PWA STANDALONE MODE');
  // PWA 模式：確保點擊座標正確
  try {
    // 不用 position:fixed，避免影響捲動，只確保 pointer-events 正常
    document.body.style.webkitTouchCallout = 'none';
    void document.body.offsetHeight; // 強制重排
  } catch(ex) {}
}

// App 渲染完成旗標
window._appReady = false;

window.onerror = function(msg, url, line, col, err) {
  // Safari 分享/背景化會觸發 Script error. 0:0，直接忽略
  if (!msg || (String(msg) === 'Script error.' && !line && !col)) return true;
  window._writeLog('error', 'onerror: ' + String(msg) + ' @' + line + ':' + col);
  // App 已渲染時，只在 debug bar 顯示，不破壞畫面
  if (window._appReady) {
    try { debugStep('ERR:' + String(msg).slice(0,40)); } catch(ex) {}
    setTimeout(function() {
      try {
        var el = document.getElementById('safari-debug');
        if (el) el.style.display = 'none';
      } catch(ex) {}
    }, 3000);
    return true;
  }
  try {
    var s = (err && err.stack) ? String(err.stack).slice(0,400) : '';
    var msg2 = 'SAFARI ERROR\n\n' + String(msg||'') + '\n\n' + String(url||'') +
               '\n' + String(line||0) + ':' + String(col||0) + (s ? '\n\n'+s : '');
    showError(msg2, '#1a0000');
  } catch(e2) {}
  return true;
};

function _rej(e) {
  try {
    var r = 'Promise rejected';
    try { r = e.reason ? (e.reason.message || String(e.reason)) : r; } catch(x) {}
    window._writeLog('error', 'rejection: ' + r);
    // 用 _appReady 判斷（比 isLoading 可靠）
    if (window._appReady) {
      // App 已渲染：只在紅條顯示，絕不覆蓋 body
      try { debugStep('PROMISE ERR: ' + String(r).slice(0, 50)); } catch(ex) {}
      setTimeout(function() {
        try {
          var el = document.getElementById('safari-debug');
          if (el) el.style.display = 'none';
        } catch(ex) {}
      }, 3000);
    }
  } catch(x) {}
}
window.onunhandledrejection = _rej;
try { window.addEventListener('unhandledrejection', _rej); } catch(e) {}

// visibility fallback 已移除（改用 error-overlay 不覆蓋 body）

debugStep('JS START OK');

// ── 崩潰偵測系統 ─────────────────────────────────────────────
(function() {
  try {
    var lastStatus = localStorage.getItem('hw5ren:alive');
    var lastLog = {};
  try { lastLog = JSON.parse(localStorage.getItem('hw5ren:debugLog') || '{}') || {}; } catch(e) {
    localStorage.removeItem('hw5ren:debugLog');
  }

    // 若上次啟動沒有正常完成（白屏/崩潰）
    if (lastStatus === 'loading' || lastStatus === 'crashed') {
      var nl = '\n';
      var crashMsg = '\u26A0\uFE0F 上次啟動異常（可能白屏）' + nl + nl;
      crashMsg += '上次記錄時間：' + (lastLog.ts || '未知') + nl;

      if (lastLog.errors && lastLog.errors.length > 0) {
        crashMsg += nl + '=== 錯誤記錄 ===' + nl;
        lastLog.errors.forEach(function(e) {
          crashMsg += '[' + e.t + '] ' + e.msg + nl;
        });
      }
      if (lastLog.steps && lastLog.steps.length > 0) {
        crashMsg += nl + '=== 最後操作步驟 ===' + nl;
        lastLog.steps.slice(-10).forEach(function(s) {
          crashMsg += '[' + s.t + '] ' + s.msg + nl;
        });
      }
      if (!lastLog.errors || lastLog.errors.length === 0) {
        crashMsg += nl + '沒有捕捉到 JS 錯誤。' + nl + '可能原因：Safari 記憶體不足強制終止。';
      }

      // 顯示在畫面上（不等 React）
      var banner = document.createElement('div');
      banner.id = 'crash-banner';
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999999;' +
        'background:#1a0000;color:#ff9999;padding:12px 14px;font-size:12px;' +
        'font-family:monospace;white-space:pre-wrap;max-height:60vh;overflow-y:auto;' +
        'border-bottom:2px solid #ff4444;box-shadow:0 4px 20px rgba(0,0,0,.8)';
      banner.textContent = crashMsg;

      var closeBtn = document.createElement('button');
      closeBtn.textContent = '✕ 關閉並繼續';
      closeBtn.style.cssText = 'display:block;margin-top:10px;padding:6px 16px;' +
        'background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);' +
        'color:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-family:sans-serif';
      closeBtn.onclick = function() {
        banner.style.display = 'none';
        localStorage.setItem('hw5ren:alive', 'dismissed');
      };
      banner.appendChild(closeBtn);

      // 等 body ready
      if (document.body) {
        document.body.appendChild(banner);
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          document.body.appendChild(banner);
        });
      }
    }

    // 標記本次啟動中
    localStorage.setItem('hw5ren:alive', 'loading');
  } catch(e) {}
})();

debugStep('JS START OK');
</script>

function ArchiveView({ idbKeys, idbGet, idbSet, groups, schoolYear, className, schoolName, classes, yearRecords, isNerv, firebaseUid, onBackupDone, onDeleteClass, deleteBusyClassId, onJumpDate }) {
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;
  const [selYear, setSelYear] = useState(schoolYear || String(new Date().getFullYear()));
  const [selSchool, setSelSchool] = useState(schoolName || '');
  const [selClass, setSelClass] = useState(className || '');
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(false);
  const [yearList, setYearList] = useState([]);
  const [activeTab, setActiveTab] = useState('stats'); // 'stats' | 'roster'
  const [fsLoaded, setFsLoaded] = useState(false); // 是否已從 Firestore 讀取
  const [archiveMeta, setArchiveMeta] = useState(null); // { archivedAt, source } 目前學年封存狀態
  // 歷年檔案清單：以實際班級清單為主（classes 有雲端備份），再併入舊版 yearRecords
  var archiveList = (function() {
    var out = [], seen = {};
    function push(year, school, cls, savedAt, isCurrent, classId) {
      var y = String(year || ''), c = String(cls || '');
      if (!y && !c) return;
      var k = y + '|' + String(school || '') + '|' + c;
      if (seen[k]) {
        if (isCurrent) seen[k].isCurrent = true;
        if (classId) seen[k].classId = classId;
        return;
      }
      var rec = { year:y, school:school || '', className:c, savedAt:savedAt || '', isCurrent:!!isCurrent, classId:classId || (y + '_' + c) };
      seen[k] = rec; out.push(rec);
    }
    filterTombstonedClasses(classes || []).forEach(function(c) {
      var cur = String(c.year) === String(schoolYear) && c.className === className;
      push(c.year, c.school, c.className, c.createdAt, cur, c.id);
    });
    (yearRecords || []).forEach(function(r) {
      var legacyRef = { id:r.id || r.classId || (String(r.year || '') + '_' + String(r.className || '')), year:r.year, school:r.school, className:r.className };
      if (!isClassTombstoned(legacyRef)) push(r.year, r.school, r.className, r.savedAt, false, legacyRef.id);
    });
    if (!out.length && className) push(schoolYear || new Date().getFullYear(), schoolName || '', className || '', '', true, currentClassKey());
    out.sort(function(a, b) {
      if (a.year !== b.year) return String(b.year).localeCompare(String(a.year));
      return String(a.className).localeCompare(String(b.className));
    });
    return out;
  })();
  const [archiving, setArchiving] = useState(false);
  const [restoring, setRestoring] = useState(false);
  const [cleaningArchives, setCleaningArchives] = useState(false);
  const [archiveHistory, setArchiveHistory] = useState([]);
  const [storageInfo, setStorageInfo] = useState(null);
  const [classLocators, setClassLocators] = useState({});
  const [passwordDialog, setPasswordDialog] = useState(null);
  const [passwordValue, setPasswordValue] = useState('');
  const [passwordConfirmValue, setPasswordConfirmValue] = useState('');
  const [passwordVisible, setPasswordVisible] = useState(false);
  const [passwordError, setPasswordError] = useState('');
  const passwordResolveRef = useRef(null);
  const importBackupRef = useRef(null);

  function requestBackupPassword(mode) {
    return new Promise(function(resolve) {
      passwordResolveRef.current = resolve;
      setPasswordValue('');
      setPasswordConfirmValue('');
      setPasswordVisible(false);
      setPasswordError('');
      setPasswordDialog({
        mode:mode,
        title:mode === 'create' ? '設定備份密碼' : '解鎖加密備份',
        description:mode === 'create'
          ? '密碼至少 8 個字元；建議混合英文、數字與符號。密碼不會被儲存。'
          : '請輸入建立這份備份時使用的密碼。'
      });
    });
  }
  function closePasswordDialog(value) {
    var resolve = passwordResolveRef.current;
    passwordResolveRef.current = null;
    setPasswordDialog(null);
    if (resolve) resolve(value);
  }
  function submitPasswordDialog() {
    var value = String(passwordValue || '');
    if (value.length < 8) { setPasswordError('密碼至少需要 8 個字元'); return; }
    if (passwordDialog && passwordDialog.mode === 'create' && value !== passwordConfirmValue) {
      setPasswordError('兩次輸入的密碼不同');
      return;
    }
    closePasswordDialog(value);
  }
  function passwordStrength(value) {
    var text = String(value || ''), score = 0;
    if (text.length >= 8) score++;
    if (text.length >= 12) score++;
    if (/[a-zA-Z]/.test(text) && /\d/.test(text)) score++;
    if (/[^a-zA-Z0-9]/.test(text)) score++;
    return { score:score, label:score <= 1 ? '偏弱' : score <= 2 ? '普通' : score === 3 ? '良好' : '強', color:score <= 1 ? '#d84315' : score <= 2 ? '#f9a825' : score === 3 ? '#2e7d32' : '#1565c0' };
  }
  function selectedClassPrefix() {
    var match = (classes || []).find(function(c) {
      return String(c.year) === String(selYear) && c.className === selClass && (!selSchool || !c.school || c.school === selSchool);
    });
    return (match && match.id ? match.id : selYear + '_' + selClass) + ':';
  }

  async function refreshStorageInfo() {
    try {
      if (!navigator.storage || !navigator.storage.estimate) return setStorageInfo(null);
      var estimate = await navigator.storage.estimate();
      var usage = Number(estimate.usage || 0), quota = Number(estimate.quota || 0);
      setStorageInfo({ usage:usage, quota:quota, ratio:quota > 0 ? usage / quota : 0 });
    } catch(e) { setStorageInfo(null); }
  }

  function archiveIndexKey(archiveKey) {
    return 'yearArchiveIndex:' + String(archiveKey || '').replace(/^yearArchive:/, '');
  }

  async function loadArchiveHistory(archiveKey) {
    if (!firebaseUid || !navigator.onLine || !archiveKey) { setArchiveHistory([]); return []; }
    try {
      var raw = await window.fsGet(firebaseUid, archiveIndexKey(archiveKey));
      var obj = typeof raw === 'string' ? safeJSON(raw, null) : raw;
      var list = obj && Array.isArray(obj.archives) ? obj.archives : [];
      list = list.slice().sort(function(a,b){ return Number(b.archivedAt || 0) - Number(a.archivedAt || 0); });
      setArchiveHistory(list);
      return list;
    } catch(e) { setArchiveHistory([]); return []; }
  }

  useEffect(function(){ refreshStorageInfo(); }, []);

  // 班級資料定位器：先讀本機，再在已登入且有網路時補上雲端實際天數。
  useEffect(function() {
    var cancelled = false;
    (async function() {
      try {
        var keys = await idbKeys(), conflicts = keys.filter(function(key){ return String(key).indexOf('conflict:') === 0; });
        var next = {};
        var safeClasses = filterTombstonedClasses(classes || []);
        safeClasses.forEach(function(cls) {
          var local = summarizeClassDataKeys(keys, cls, cls.year, false);
          var encoded = encodeURIComponent(String(cls.id || ''));
          next[cls.id] = {
            local:local, cloud:null,
            pending:getDirtyKeys(String(cls.id || '') + ':').length,
            conflicts:conflicts.filter(function(key){ return String(key).indexOf(String(cls.id || '')) >= 0 || String(key).indexOf(encoded) >= 0; }).length
          };
        });
        if (!cancelled) setClassLocators(Object.assign({}, next));
        if (firebaseUid && navigator.onLine) {
          var remoteLocatorRows = await mapWithConcurrency(safeClasses, 3, async function(cls) {
            var pfx = String(cls.id || '') + ':';
            try {
              var remoteParts = await Promise.all([
                window.fsGetAll(firebaseUid, pfx + 'day:'),
                window.fsGetAll(firebaseUid, pfx + 'counsel:')
              ]);
              var remoteKeys = Object.keys(remoteParts[0] || {}).concat(Object.keys(remoteParts[1] || {}));
              return { id:cls.id, cloud:summarizeClassDataKeys(remoteKeys, cls, cls.year, false) };
            } catch(eRemoteLocator) {
              return { id:cls.id, cloud:null };
            }
          });
          remoteLocatorRows.forEach(function(row) {
            if (row && row.id && row.cloud) next[row.id] = Object.assign({}, next[row.id], { cloud:row.cloud });
          });
          if (!cancelled) setClassLocators(Object.assign({}, next));
        }
      } catch(eLocator) { if (!cancelled) setClassLocators({}); }
    })();
    return function(){ cancelled = true; };
  }, [firebaseUid, classes, schoolYear]);

  // 取得所有有資料的學年（從 IDB + yearRecords 合併）
  useEffect(() => {
    (async () => {
      try {
        const keys = await idbKeys();
        const years = new Set();
        // 從 IDB 實際日期換算「學年度起始年」，不再把 1～7 月誤算成另一學年。
        keys.forEach(k => {
          if (typeof k === 'string') {
            const parsed = parsePrimaryRecordKey(k);
            if (parsed && parsed.kind === 'day') {
              var academicYear = academicYearForDate(parsed.date);
              if (academicYear) years.add(academicYear);
            }
          }
        });
        // 從 yearRecords 取歷年記錄
        if (Array.isArray(yearRecords)) {
          yearRecords.forEach(r => { if (r && r.year) years.add(String(r.year)); });
        }
        if (schoolYear) years.add(String(schoolYear));
        const arr = Array.from(years).sort().reverse();
        setYearList(arr.length > 0 ? arr : [String(schoolYear || new Date().getFullYear())]);
        if (arr.length > 0 && !arr.includes(selYear)) setSelYear(arr[0]);
      } catch(e) {
        setYearList([String(schoolYear || new Date().getFullYear())]);
      }
    })();
  }, []);

  // 載入選定學年的統計（抽成具名函式，供 useEffect 與封存/還原完成後重用刷新）
  async function loadYearStats() {
    if (!selYear) return;
    setLoading(true);
    try {
      const keys = await idbKeys();
      // key 格式（新）：'class_id:day:2026-06-05' 或（舊）：'day:2026-06-05'
      var _arcPfx2 = selectedClassPrefix();
      var selectedId = _arcPfx2.replace(/:$/, ''), selectedRange = academicYearRange(selYear);
      const yearKeys = keys.filter(function(k) {
        var parsed = parsePrimaryRecordKey(k);
        return parsed && parsed.kind === 'day' &&
          (parsed.classKey === selectedId || parsed.legacy) &&
          parsed.date >= selectedRange.start && parsed.date <= selectedRange.end;
      });
      const hwCount = {};      // 各作業繳交次數
      const absentMap = {};    // 各學生請假天數
      const groupSnapshots = {};  // 每月分組快照（從資料推算）
      let totalDays = 0;
      let totalAbsent = 0;

      const yearRows = await mapWithConcurrency(yearKeys, 12, async function(k) {
        try {
          const data = await idbGet(k);
          if (!data) return null;
          return typeof data === 'string' ? JSON.parse(data) : data;
        } catch(e) {
          return null;
        }
      });

      for (const parsed of yearRows) {
        if (!parsed) continue;
        totalDays++;

        // 統計作業
        if (parsed.rows) {
          parsed.rows.forEach(row => {
            if (row.hwName) {
              hwCount[row.hwName] = (hwCount[row.hwName] || 0) + 1;
            }
          });
        }
        // 統計請假：實際儲存格式為 attendance.{personal,sick,public,late}
        var dailyAbsent = {};
        var att = parsed.attendance || {};
        [['personal','personal'],['sick','sick'],['public','official'],['late','late']].forEach(function(pair) {
          var typeKey = pair[0], statKey = pair[1];
          var seats = Array.isArray(att[typeKey]) ? att[typeKey] : [];
          seats.forEach(function(seat) {
            var name = String(seat);
            if (!absentMap[name]) absentMap[name] = { total:0, sick:0, personal:0, official:0, late:0 };
            absentMap[name][statKey] = (absentMap[name][statKey] || 0) + 1;
            dailyAbsent[name] = true;
          });
        });
        var period = parsed.attendancePeriod || {};
        Object.keys(period).forEach(function(seat) {
          var perSeat = period[seat] || {};
          var hasAny = false;
          [['personal','personal'],['sick','sick'],['public','official']].forEach(function(pair) {
            if (Array.isArray(perSeat[pair[0]]) && perSeat[pair[0]].length > 0) {
              if (!absentMap[String(seat)]) absentMap[String(seat)] = { total:0, sick:0, personal:0, official:0, late:0 };
              absentMap[String(seat)][pair[1]]++;
              hasAny = true;
            }
          });
          if (hasAny) dailyAbsent[String(seat)] = true;
        });
        Object.keys(dailyAbsent).forEach(function(name) {
          absentMap[name].total++;
          totalAbsent++;
        });
      }

      // 排序：作業出現次數由高到低
      const topHW = Object.entries(hwCount)
        .sort((a,b) => b[1]-a[1])
        .slice(0, 10);

      // 請假最多的前5名
      const topAbsent = Object.entries(absentMap)
        .sort((a,b) => b[1].total - a[1].total)
        .slice(0, 5);

      setStats({ totalDays, totalAbsent, topHW, topAbsent, hwCount, absentMap });
      setLoading(false);
    } catch(e) {
      setLoading(false);
    }
  }
  useEffect(() => {
    loadYearStats();
  }, [selYear, selSchool, selClass]);

  // 當切換 year/school/class 時，從 Firestore 讀取對應資料到 IDB
  useEffect(() => {
    if (!firebaseUid || !selYear) return;
    var _arcPfx = selectedClassPrefix();
        setFsLoaded(false);
    (async () => {
      try {
        // 從 Firestore 讀取該班級資料，再依完整學年度（8 月～隔年 7 月）篩選。
        var allData = await window.fsGetAll(firebaseUid, _arcPfx+'day:');
        var cloudRange = academicYearRange(selYear);
        var count = 0;
        var pendingCloudDays = [];
        for (var k in allData) {
          var parsedCloudKey = parsePrimaryRecordKey(k);
          if (parsedCloudKey && parsedCloudKey.kind === 'day' &&
              parsedCloudKey.classKey === _arcPfx.replace(/:$/, '') &&
              parsedCloudKey.date >= cloudRange.start && parsedCloudKey.date <= cloudRange.end) {
            pendingCloudDays.push({ key:k, val:allData[k] });
            count++;
          }
        }
        await Promise.all(pendingCloudDays.map(function(p){ return idbSet(p.key, p.val); }));
        setFsLoaded(true);
        if (count > 0) await loadYearStats();
      } catch(e) {
        setFsLoaded(true);
      }
    })();
  }, [selYear, selSchool, selClass, firebaseUid]);

  // ── 學年封存：檢查目前班級前綴是否已有封存快照（僅顯示用途）──
  useEffect(() => {

        await loadArchiveHistory(archiveKey);

    })();
  }, [firebaseUid, className, schoolYear]);

  async function buildArchiveSnapshot() {
    var pfx = classPrefix();
    if (!pfx) throw new Error('尚未設定班級前綴');
    var ck = pfx.replace(/:$/, '');
    var yr = schoolYear || String(new Date().getFullYear());
    var keys = await idbKeys();
    var days = {}, dailyCounsel = {}, syncConflicts = {};
    var totalDays = 0, totalLeave = 0;
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (typeof k !== 'string') continue;
      if (k.indexOf(pfx + 'day:') === 0) {
        var raw = await idbGet(k);
        if (!raw) continue;
        days[k] = raw;
        totalDays++;
        try {
          var parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
          var att = parsed && parsed.attendance || {};
          ['personal','sick','public','late'].forEach(function(t){ if (Array.isArray(att[t])) totalLeave += att[t].length; });
          Object.keys(parsed && parsed.attendancePeriod || {}).forEach(function(seat){
            var per = parsed.attendancePeriod[seat] || {};
            if (Object.keys(per).some(function(t){ return Array.isArray(per[t]) && per[t].length > 0; })) totalLeave++;
          });
        } catch(eParse) {}
      } else if (k.indexOf(pfx + 'counsel:') === 0) {
        var counselRaw = await idbGet(k);
        if (counselRaw) dailyCounsel[k] = counselRaw;
      } else if (k.indexOf('conflict:') === 0) {
        var conflictRaw = await idbGet(k);
        if (conflictRaw) syncConflicts[k] = conflictRaw;
      }
    }
    var remoteWp = [], remoteGr = [];
    if (firebaseUid && navigator.onLine) {
      remoteWp = await window.wpGetAll(firebaseUid, ck) || [];
      remoteGr = await window.grGetAll(firebaseUid, ck) || [];
    }
    var weeklyPlans = await mergeSecondaryRecords('wp', ck, remoteWp);
    var guidanceRecords = await mergeSecondaryRecords('gr', ck, remoteGr);
    var activeClassId = _sl.get('hw5ren:activeClass') || ck;
    var groupVersionsRaw = _sl.get('hw5ren:groupVersions:' + activeClassId);
    var officersRaw = _sl.get('hw5ren:officers:' + activeClassId);
    var snapshot = {
      schemaVersion: APP_SCHEMA_VERSION,
      format: 'limu-teacher-year-archive',
      archivedAt: Date.now(),
      year: yr,
      classKey: ck,
      className: className || '',
      schoolName: schoolName || '',
      days: days,
      dailyCounsel: dailyCounsel,
      weeklyPlans: weeklyPlans,
      guidanceRecords: guidanceRecords,
      syncConflicts: syncConflicts,
      groupVersions: groupVersionsRaw ? safeJSON(groupVersionsRaw, []) : [],
      officers: officersRaw ? safeJSON(officersRaw, {}) : {},
      settings: {
        activeClass: activeClassId,
        classes: filterTombstonedClasses(safeJSON(_sl.get('hw5ren:classes') || '[]', [])),
        deletedClasses: readClassTombstones(),
        groups: groups || [],
        className: className || '',
        schoolName: schoolName || '',
        schoolYear: yr,
        classSize: parseInt(_sl.get('hw5ren:classSize') || '40', 10) || 40,
        semStart1: _sl.get('hw5ren:semStart1') || '',
        semStart2: _sl.get('hw5ren:semStart2') || '',
        semEnd1: _sl.get('hw5ren:semEnd1') || '',
        semEnd2: _sl.get('hw5ren:semEnd2') || '',
        schoolCalendar: safeJSON(_sl.get('hw5ren:schoolCal:' + activeClassId) || _sl.get('hw5ren:schoolCal') || '{}', {}),
        schoolEvents: normalizeSchoolEventStore(safeJSON(_sl.get('hw5ren:schoolEvents:' + activeClassId) || '{}', {})),
        officerPresets: (function(){
            var stored = safeJSON(_sl.get('hw5ren:officerPresets') || '[]', []);
            // v20.22：舊版預設為空陣列，新班級一個快速選項都沒有。
            // 這裡提供一份常用職稱作為預設，使用者仍可自由新增/刪除。
            return (Array.isArray(stored) && stored.length) ? stored : DEFAULT_OFFICER_PRESETS.slice();
        })(),
        slipPresets: safeJSON(_sl.get('hw5ren:slipPresets') || '[]', []),
        customHW: safeJSON(_sl.get('hw5ren:customHW') || '[]', []),
        recentHW: safeJSON(_sl.get('hw5ren:recentHW') || '[]', []),
        hwPickerHistory: safeJSON(_sl.get('hw5ren:hwPickerHistory') || '{}', {}),
        reminderHistory: safeJSON(_sl.get('hw5ren:reminderHistory') || '[]', [])
      },
      stats: {
        totalDays: totalDays,

        weeklyPlans: weeklyPlans.length,
        guidanceRecords: guidanceRecords.length,
        dailyCounsel: Object.keys(dailyCounsel).length,
        syncConflicts: Object.keys(syncConflicts).length
      }
    };
    return snapshot;
  }

  async function makeBackupPackage(snapshot) {
    var checksum = await sha256Hex(JSON.stringify(snapshot));
    return { format:'limu-teacher-full-backup', schemaVersion:APP_SCHEMA_VERSION, checksum:checksum, snapshot:snapshot };
  }

  async function cleanupRemoteArchiveHistory(archiveKey) {
    if (!firebaseUid || !navigator.onLine) return { deleted:0, kept:0 };
    var idxKey = archiveIndexKey(archiveKey);
    var raw = await window.fsGet(firebaseUid, idxKey);
    var idx = typeof raw === 'string' ? safeJSON(raw, null) : raw;
    var allEntries = idx && Array.isArray(idx.archives) ? idx.archives.slice() : [];
    var currentMeta = null;
    try { currentMeta = await window.fsGet(firebaseUid, archiveKey); } catch(eCurrent) {}
    if (typeof currentMeta === 'string') currentMeta = safeJSON(currentMeta, null);
    var kept = selectArchiveHistory(allEntries, currentMeta, 3), allowed = {};
    kept.forEach(function(entry) {
      if (entry.legacyParts) {
        allowed[archiveKey + ':' + entry.archiveId + ':meta'] = true;
        for (var lp = 1; lp <= Number(entry.parts || 0); lp++) allowed[archiveKey + ':part' + lp] = true;
      } else {
        allowed[archiveKey + ':' + entry.archiveId + ':meta'] = true;
        for (var pi = 1; pi <= Number(entry.parts || 0); pi++) allowed[archiveKey + ':' + entry.archiveId + ':part' + pi] = true;
      }
    });
    var nodes = await window.fsGetAll(firebaseUid, archiveKey + ':');
    var deleteKeys = Object.keys(nodes || {}).filter(function(key){ return !allowed[key]; });
    for (var di = 0; di < deleteKeys.length; di++) await window.fsDelete(firebaseUid, deleteKeys[di]);
    await window.fsSet(firebaseUid, idxKey, { schemaVersion:APP_SCHEMA_VERSION, maxArchives:3, updatedAt:Date.now(), archives:kept });
    setArchiveHistory(kept);
    return { deleted:deleteKeys.length, kept:kept.length };
  }

  async function saveRemoteArchive(archiveKey, snapshot) {
    var json = JSON.stringify(snapshot);
    var checksum = await sha256Hex(json);
    var byteLength = new Blob([json]).size;
    var archiveId = 'a' + snapshot.archivedAt;
    var previousMeta = null;
    try { previousMeta = await window.fsGet(firebaseUid, archiveKey); } catch(ePrev) {}
    if (typeof previousMeta === 'string') previousMeta = safeJSON(previousMeta, null);
    var idxKey = archiveIndexKey(archiveKey);
    var idxRaw = null;
    try { idxRaw = await window.fsGet(firebaseUid, idxKey); } catch(eIdx) {}
    var idxObj = typeof idxRaw === 'string' ? safeJSON(idxRaw, null) : idxRaw;
    var history = idxObj && Array.isArray(idxObj.archives) ? idxObj.archives.slice() : [];

    // 把 v8 以前只存在「目前封存」位置的版本先固定下來，避免被新封存覆蓋。
    if (previousMeta && previousMeta.archivedAt) {
      var previousId = previousMeta.archiveId || ('legacy' + previousMeta.archivedAt);
      var previousStableMeta = Object.assign({}, previousMeta, { archiveId:previousId, legacyParts:!previousMeta.archiveId });
      await window.fsSet(firebaseUid, archiveKey + ':' + previousId + ':meta', previousStableMeta);
      history.push({ archiveId:previousId, archivedAt:previousMeta.archivedAt, byteLength:previousMeta.byteLength || 0, parts:Number(previousMeta.parts || 0), checksum:previousMeta.checksum || '', legacyParts:!previousMeta.archiveId });
    }

    var metaObj = {
      schemaVersion:APP_SCHEMA_VERSION, complete:true, archiveId:archiveId,
      checksum:checksum, byteLength:byteLength, archivedAt:snapshot.archivedAt,
      year:snapshot.year, className:snapshot.className, schoolName:snapshot.schoolName, stats:snapshot.stats
    };
    if (byteLength > 700000) {
      var maxChunkBytes = 700000, parts = [], part = '', partBytes = 0, encoder = new TextEncoder();
      for (var ch of json) {
        var chBytes = encoder.encode(ch).length;
        if (part && partBytes + chBytes > maxChunkBytes) { parts.push(part); part = ''; partBytes = 0; }
        part += ch; partBytes += chBytes;
      }
      if (part) parts.push(part);
      for (var pi = 0; pi < parts.length; pi++) {
        await window.fsSet(firebaseUid, archiveKey + ':' + archiveId + ':part' + (pi + 1), parts[pi]);
      }
      metaObj.parts = parts.length;
    } else {
      metaObj.inline = json;
      metaObj.parts = 0;
    }
    // 先完成獨立版本，再更新「目前封存」指標；中途失敗不會破壞舊版。
    await window.fsSet(firebaseUid, archiveKey + ':' + archiveId + ':meta', metaObj);
    await window.fsSet(firebaseUid, archiveKey, metaObj);
    history.push({ archiveId:archiveId, archivedAt:snapshot.archivedAt, byteLength:byteLength, parts:Number(metaObj.parts || 0), checksum:checksum });
    await window.fsSet(firebaseUid, idxKey, { schemaVersion:APP_SCHEMA_VERSION, maxArchives:3, updatedAt:Date.now(), archives:history });
    try { return await cleanupRemoteArchiveHistory(archiveKey); }
    catch(eCleanup) { await loadArchiveHistory(archiveKey); return { deleted:0, kept:history.length, cleanupPending:true }; }
  }

  async function cleanOldArchives() {
    if (!firebaseUid || !navigator.onLine) { alert('請先登入並連上網路，才能清理雲端舊封存'); return; }
    if (!confirm('將保留最近 3 份完整封存，並刪除無主或更舊的封存分段。\n目前學年資料不會被刪除。確定繼續？')) return;
    setCleaningArchives(true);
    try {
      var pfx = classPrefix();
      if (!pfx) throw new Error('尚未設定班級');
      var result = await cleanupRemoteArchiveHistory('yearArchive:' + pfx.replace(/:$/, ''));
      alert('✅ 清理完成：保留 ' + result.kept + ' 份，移除 ' + result.deleted + ' 個舊分段');
    } catch(e) { alert('清理未完成：' + String(e && e.message || e)); }
    setCleaningArchives(false);

  async function readRemoteArchive(archiveKey, archiveId) {
    if (!firebaseUid || !navigator.onLine) return null;
    var meta = await window.fsGet(firebaseUid, archiveId ? (archiveKey + ':' + archiveId + ':meta') : archiveKey);
    if (!meta) return null;
    var metaObj = typeof meta === 'string' ? safeJSON(meta, null) : meta;
    if (!metaObj) return null;
    if (metaObj.days) return metaObj;
    var full = '';
    if (metaObj.inline) full = metaObj.inline;
    else if (metaObj.parts) {
      for (var pi = 1; pi <= metaObj.parts; pi++) {
        var partKey = metaObj.legacyParts
          ? archiveKey + ':part' + pi
          : (metaObj.archiveId ? archiveKey + ':' + metaObj.archiveId + ':part' + pi : archiveKey + ':part' + pi);
        var partVal = await window.fsGet(firebaseUid, partKey);
        if (partVal === null || partVal === undefined) throw new Error('封存分段缺少第 ' + pi + ' 段');
        full += typeof partVal === 'string' ? partVal : JSON.stringify(partVal);
      }
    }
    if (!full) return null;
    if (metaObj.checksum && await sha256Hex(full) !== metaObj.checksum) throw new Error('封存校驗失敗，已停止還原');
    return safeJSON(full, null);
  }

  async function readLocalArchive(archiveKey) {
    var raw = await idbGet(archiveKey);
    var obj = parseStoredObject(raw, null);
    if (!obj) return null;
    if (obj.snapshot) {
      if (obj.checksum && await sha256Hex(JSON.stringify(obj.snapshot)) !== obj.checksum) throw new Error('本機備份校驗失敗');
      return obj.snapshot;
    }
    return obj.days ? obj : null;
  }

  async function applyArchiveSnapshot(snapshot, overwrite) {
    if (!snapshot || !snapshot.days) throw new Error('備份格式異常，沒有每日資料');
    var targetClassKey = snapshot.classKey || currentClassKey();
    if (isClassTombstoned(targetClassKey)) {
      throw new Error('這個班級已被完整刪除，為避免舊備份讓它復活，已停止還原');
    }
    var added = 0, skipped = 0, counselAdded = 0;
    var collections = [snapshot.days || {}, snapshot.dailyCounsel || {}];
    for (var ci = 0; ci < collections.length; ci++) {
      var collection = collections[ci];
      for (var key in collection) {
        var dataKind = ci === 0 ? 'day' : 'counsel';
        if (!archiveDataKeyBelongsToTarget(key, dataKind, snapshot)) { skipped++; continue; }
        var existing = await idbGet(key);
        if (!overwrite && existing) { skipped++; continue; }
        await idbSet(key, collection[key]);
        markDirtyKey(key);
        if (ci === 0) added++; else counselAdded++;
      }
    }
    var savedConflicts = snapshot.syncConflicts || {};
    for (var conflictKey in savedConflicts) {
      if (overwrite || !(await idbGet(conflictKey))) await idbSet(conflictKey, savedConflicts[conflictKey]);
    }
    var plans = snapshot.weeklyPlans || [];
    for (var wi = 0; wi < plans.length; wi++) {
      var plan = Object.assign({}, plans[wi], { classKey:targetClassKey });
      if (plan.id) await putSecondaryLocal('wp', targetClassKey, plan, 'pending', false);
    }
    var records = snapshot.guidanceRecords || [];
    for (var gi = 0; gi < records.length; gi++) {
      var rec = Object.assign({}, records[gi], { classKey:targetClassKey, classId:targetClassKey });
      if (rec.id) await putSecondaryLocal('gr', targetClassKey, rec, 'pending', false);
    }
    var settings = snapshot.settings || {};
    function setSetting(key, value) {
      if (value === undefined || value === null || value === '') return;
      if (overwrite || !_sl.get(key)) _sl.set(key, typeof value === 'string' ? value : JSON.stringify(value));
    }
    var tombstones = readClassTombstones();
    var existingClasses = filterTombstonedClasses(safeJSON(_sl.get('hw5ren:classes') || '[]', []), tombstones);
    // 封存內可能含有當時的「全部班級清單」；還原時只處理這份封存的目標班級。
    var classMerge = mergeArchiveTargetClass(existingClasses, snapshot, overwrite, tombstones);
    if (classMerge.blocked) throw new Error('這個班級已被完整刪除，已停止還原');
    var mergedClasses = classMerge.classes;
    _sl.set('hw5ren:activeClass', targetClassKey);
    _sl.set('hw5ren:classes', JSON.stringify(mergedClasses));
    setSetting('hw5ren:groups', settings.groups);
    setSetting('hw5ren:className', settings.className || snapshot.className);
    setSetting('hw5ren:school', settings.schoolName || snapshot.schoolName);
    setSetting('hw5ren:year', settings.schoolYear || snapshot.year);
    setSetting('hw5ren:classSize', settings.classSize || snapshot.classSize);
    setSetting('hw5ren:semStart1', settings.semStart1);
    setSetting('hw5ren:semStart2', settings.semStart2);
    setSetting('hw5ren:semEnd1', settings.semEnd1);
    setSetting('hw5ren:semEnd2', settings.semEnd2);
    setSetting('hw5ren:schoolCal', settings.schoolCalendar);
    if (settings.schoolCalendar) setSetting('hw5ren:schoolCal:' + targetClassKey, settings.schoolCalendar);
    if (settings.schoolEvents) setSetting('hw5ren:schoolEvents:' + targetClassKey, normalizeSchoolEventStore(settings.schoolEvents));
    // 個人清單：以聯集併回，避免還原舊封存時洗掉目前已累積的清單
    if (settings.officerPresets !== undefined) setSetting('hw5ren:officerPresets', mergeNameList(settings.officerPresets, safeJSON(_sl.get('hw5ren:officerPresets') || '[]', []), 0));
    if (settings.slipPresets !== undefined) setSetting('hw5ren:slipPresets', mergeNameList(settings.slipPresets, safeJSON(_sl.get('hw5ren:slipPresets') || '[]', []), 0));
    if (settings.customHW !== undefined) setSetting('hw5ren:customHW', mergeNameList(settings.customHW, safeJSON(_sl.get('hw5ren:customHW') || '[]', []), 20));
    if (settings.reminderHistory !== undefined) setSetting('hw5ren:reminderHistory', mergeNameList(settings.reminderHistory, safeJSON(_sl.get('hw5ren:reminderHistory') || '[]', []), 10));
    if (settings.recentHW !== undefined) setSetting('hw5ren:recentHW', mergeRecentHW(settings.recentHW, safeJSON(_sl.get('hw5ren:recentHW') || '[]', []), 15));
    if (settings.hwPickerHistory !== undefined) setSetting('hw5ren:hwPickerHistory', mergeLessonHistory(settings.hwPickerHistory, safeJSON(_sl.get('hw5ren:hwPickerHistory') || '{}', {})));
    if (Array.isArray(settings.groups)) _sl.set('hw5ren:groups:' + targetClassKey, JSON.stringify(settings.groups));
    if (snapshot.groupVersions && (overwrite || !_sl.get('hw5ren:groupVersions:' + targetClassKey))) {
      _sl.set('hw5ren:groupVersions:' + targetClassKey, JSON.stringify(snapshot.groupVersions));
    }
    if (snapshot.officers && (overwrite || !_sl.get('hw5ren:officers:' + targetClassKey))) {
      _sl.set('hw5ren:officers:' + targetClassKey, JSON.stringify(snapshot.officers));
    }
    markSettingsDirty('settings:main', '班級設定');
    markSettingsDirty('groupVersions:' + targetClassKey, '組別版本');
    markSettingsDirty('officers:' + targetClassKey, '幹部資料');
    markSettingsDirty('schoolCalendar:' + targetClassKey, '學校行事曆');
    if (settings.schoolEvents) markSettingsDirty('schoolEvents:' + targetClassKey, '公開學校行事曆');
    return { added:added, skipped:skipped, counselAdded:counselAdded, plans:plans.length, guidance:records.length };
  }

  async function archiveCurrentYear() {

  async function downloadFullBackup() {
    try {
      setArchiving(true);
      var snapshot = await buildArchiveSnapshot();
      var backupPackage = await makeBackupPackage(snapshot);
      var protect = confirm('是否使用密碼保護這份備份？\n\n確定＝AES 加密備份（建議）\n取消＝一般 JSON 備份');
      var payload = backupPackage, encrypted = false;
      if (protect) {
        var password = await requestBackupPassword('create');
        if (password === null) { setArchiving(false); return; }
        payload = await encryptBackupPackage(backupPackage, password);
        encrypted = true;
      } else if (!confirm('一般 JSON 備份可被直接閱讀，可能包含學生資料。\n仍要下載一般備份嗎？')) {
        setArchiving(false); return;
      }
      var blob = new Blob([JSON.stringify(payload)], { type:'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'LIMU-backup-' + snapshot.classKey.replace(/[^a-zA-Z0-9_\-\u4e00-\u9fff]/g, '_') + '-' + new Date().toISOString().slice(0,10) + (encrypted ? '-encrypted' : '') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
      try { _sl.set('hw5ren:lastBackupEpoch', String(Date.now())); } catch(exB) {}
      if (typeof onBackupDone === 'function') onBackupDone();
      setArchiving(false);
    } catch(e) { setArchiving(false); alert('匯出失敗：' + (e && e.message || e)); }
  }

  async function importFullBackupFile(event) {
    var file = event && event.target && event.target.files && event.target.files[0];
    if (!file) return;
    setRestoring(true);
    try {
      var obj = JSON.parse(await file.text());
      if (obj && obj.format === 'limu-teacher-encrypted-backup') {
        var password = await requestBackupPassword('unlock');
        if (password === null) { setRestoring(false); return; }
        obj = await decryptBackupPackage(obj, password);
      }
      var snapshot = obj && obj.snapshot ? obj.snapshot : obj;
      if (obj && obj.checksum && await sha256Hex(JSON.stringify(snapshot)) !== obj.checksum) throw new Error('備份校驗失敗，檔案可能不完整');
      if (!snapshot || !snapshot.days) throw new Error('不是可辨識的 LIMU 備份檔');
      if (!confirm('即將匯入「' + (snapshot.className || snapshot.classKey || '未命名班級') + '」完整備份。確定繼續？')) { setRestoring(false); return; }
      var overwrite = confirm('是否使用完整覆蓋模式？\n確定＝覆蓋同日期資料；取消＝只補缺少資料');
      var result = await applyArchiveSnapshot(snapshot, overwrite);
      var localPackage = await makeBackupPackage(snapshot);
      await idbSet('yearArchive:' + (snapshot.classKey || currentClassKey()), JSON.stringify(localPackage));
      await refreshStorageInfo();
      setRestoring(false);
      alert('✅ 匯入完成：每日 ' + result.added + ' 筆、週計畫 ' + result.plans + ' 份、輔導 ' + result.guidance + ' 筆');
      window.location.reload();
    } catch(e) {
      setRestoring(false);
      alert('匯入失敗：' + (e && e.message || e));
    } finally {
      try { event.target.value = ''; } catch(ex) {}
    }
  }

  async function restoreFromArchive(archiveId) {
    try {
      var pfx = classPrefix();
      if (!pfx) { alert('尚未設定班級前綴，無法還原'); return; }
      setRestoring(true);
      var archiveKey = 'yearArchive:' + pfx.replace(/:$/, '');
      var snapshot = null, source = '';
      var remoteError = null;
      try { snapshot = await readRemoteArchive(archiveKey, archiveId); if (snapshot) source = archiveId ? 'Firebase 歷史版本' : 'Firebase'; } catch(eRemote) { remoteError = eRemote; }
      if (!snapshot && !archiveId) { snapshot = await readLocalArchive(archiveKey); if (snapshot) source = remoteError ? '本機（雲端暫時無法讀取）' : '本機'; }
      if (!snapshot && remoteError) throw remoteError;
      if (!snapshot) { setRestoring(false); alert('尚無封存快照可還原'); return; }
      if (!confirm('將從' + source + '封存還原。預設只補上本機缺少的資料，現有資料會保留。確定開始？')) { setRestoring(false); return; }
      var overwrite = confirm('是否改用完整覆蓋模式？\n確定＝覆蓋；取消＝維持補漏模式');
      var result = await applyArchiveSnapshot(snapshot, overwrite);
      setRestoring(false);
      alert('✅ 還原完成：每日新增 ' + result.added + '、跳過 ' + result.skipped + '、週計畫 ' + result.plans + '、輔導 ' + result.guidance);
      window.location.reload();
    } catch(e) {
      setRestoring(false);
      alert('還原失敗：' + (e && e.message || e));
    }
  }

  const accent = isNerv ? '#ff6600' : '#1e3a5f';
  const cardStyle = {

                var sorted = versions.slice().sort(function(a,b){ return String(b.effectiveDate || '').localeCompare(String(a.effectiveDate || '')); });
                var todayKey = new Date().toISOString().slice(0,10);
                var current = sorted.find(function(v){ return v.effectiveDate <= todayKey; }) || sorted[sorted.length-1];
                if (current && Array.isArray(current.groups)) { setGroups(current.groups); _sl.set('hw5ren:groups', JSON.stringify(current.groups)); }
            }
            return;
        }
        if (key.indexOf('officers:') === 0) {
            var officerCid = key.slice('officers:'.length);
            _sl.set('hw5ren:officers:' + officerCid, JSON.stringify(value));
            if (officerCid === (_sl.get('hw5ren:activeClass') || activeClassId)) setOfficers(value);
            return;
        }
        if (key.indexOf('schoolCalendar:') === 0) {
            var calendarCid = key.slice('schoolCalendar:'.length);
            _sl.set('hw5ren:schoolCal:' + calendarCid, JSON.stringify(value));
            if (calendarCid === (_sl.get('hw5ren:activeClass') || activeClassId)) {
                setSchoolCalendar(value);
                _sl.set('hw5ren:schoolCal', JSON.stringify(value));
            }
            return;
        }
        if (key.indexOf('schoolEvents:') === 0) {
            var eventsCid = key.slice('schoolEvents:'.length), normalizedEvents = normalizeSchoolEventStore(value);
            _sl.set('hw5ren:schoolEvents:' + eventsCid, JSON.stringify(normalizedEvents));
            if (eventsCid === (_sl.get('hw5ren:activeClass') || activeClassId)) { setSchoolEventStore(normalizedEvents); setSchoolWebsiteInput(normalizedEvents.profile.schoolUrl || ''); }
        }
    }
